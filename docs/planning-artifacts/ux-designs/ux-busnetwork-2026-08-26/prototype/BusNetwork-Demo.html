    const cid = myCid(), c = BN.company(cid);
    const startIso = BN.localToIso(d.start), endIso = BN.localToIso(d.end);
    const deadline = d.deadline ? BN.localToIso(d.deadline) : startIso;   // PRD WA-10
    const buildReq = (pid) => {
      const o = BN.formOffer(pid);
      return {
        partnerId: pid, agreement: o.agreement, calc: o.calc === null ? 0 : o.calc, offer: o.offer,
        overridden: o.overridden, overriddenBy: o.overridden ? me().name : null,
        costs: o.costs.filter((x) => x.desc.trim()).map((x) => ({ desc: x.desc, amount: parseMoney(x.amount) })),
        state: 'PENDING', withdrawReason: null, respondedBy: null, respondedAt: null, reason: null, closedAt: null,
      };
    };
    if (f.mode === 'edit') {
      const t = BN.tripById(f.tripId);
      const changes = [];
      const setIf = (label, obj, key, val) => { if (String(obj[key]) !== String(val)) { changes.push(label); obj[key] = val; } };
      setIf('planned start', t, 'plannedStart', startIso);
      setIf('planned end', t, 'plannedEnd', endIso);
      if (t.from.address !== d.from) { changes.push('from address'); t.from = { address: d.from }; }
      if (t.to.address !== d.to) { changes.push('to address'); t.to = { address: d.to }; }
      if (t.vias.map((v) => v.address).join('|') !== d.vias.join('|')) { changes.push('via stops'); t.vias = d.vias.map((a) => ({ address: a })); }
      setIf('PAX', t, 'pax', d.pax === '' ? null : +d.pax);
      setIf('customer price', t, 'customerPrice', parseMoney(d.customerPrice));
      setIf('response deadline', t, 'deadline', deadline);
      t.comments = Object.assign({}, d.comments); t.flightNo = d.flightNo; t.groupRef = d.groupRef; t.sign = d.sign; t.vehicle = Object.assign({}, d.vehicle);
      const pending = t.requests.filter((r) => r.state === 'PENDING');
      pending.forEach((r) => {
        if (d.partners.indexOf(r.partnerId) === -1) {
          r.state = 'WITHDRAWN'; r.withdrawReason = 'Removed by host'; r.closedAt = BN.nowIso();
          changes.push('removed ' + cname(r.partnerId));
          BN.notify(r.partnerId, ['PCOORD'], 'N-03', 'Trip ' + t.id + ' is no longer offered to you.', '#/trips/' + t.id, ['In-app']);
        } else {
          const o = BN.formOffer(r.partnerId);
          if (r.offer !== o.offer) { BN.hist(t, 'price', 'Offer price changed', cname(r.partnerId) + ': ' + money(r.offer, t.currency) + ' → ' + money(o.offer, t.currency), 'BOTH'); r.offer = o.offer; r.overridden = o.overridden; r.overriddenBy = o.overridden ? me().name : null; }
          r.costs = o.costs.filter((x) => x.desc.trim()).map((x) => ({ desc: x.desc, amount: parseMoney(x.amount) }));
        }
      });
      d.partners.forEach((pid) => {
        if (!t.requests.some((r) => r.partnerId === pid && r.state === 'PENDING')) {
          t.requests.push(buildReq(pid)); changes.push('added ' + cname(pid));
          BN.notify(pid, ['PCOORD'], 'N-01', cname(cid) + ' shared trip ' + t.id + ' (' + fmtDT(t.plannedStart) + '). Respond by ' + fmtDT(deadline) + '.', '#/trips/' + t.id, ['In-app', 'Email', 'Push']);
        }
      });
      BN.hist(t, 'edit', 'Request edited', changes.length ? changes.join(', ') : 'no field changes');
      f.done = { tripId: t.id, partners: d.partners.slice(), edited: true };
      return null;
    }
    const id = String(++BN.S.seq.trip);
    const t = {
      id: id, teqRef: d.source || id, hostId: cid, type: d.type, status: 'REQUESTED', statusChangedAt: BN.nowIso(),
      closedAt: null, closedReason: null, cancelledBy: null, roundTrip: !!d.roundTrip,
      plannedStart: startIso, plannedEnd: endIso, returnAt: d.ret ? BN.localToIso(d.ret) : null,
      from: { address: d.from }, vias: d.vias.map((a) => ({ address: a })), to: { address: d.to }, altStart: null,
      pax: d.pax === '' ? null : +d.pax, paxOff: !!d.paxOff, vehicle: Object.assign({}, d.vehicle),
      flightNo: d.flightNo, groupRef: d.groupRef, sign: d.sign, comments: Object.assign({}, d.comments),
      customerId: d.customerId, customerPrice: d.customerPrice === '' ? 0 : parseMoney(d.customerPrice), currency: c.currency,
      deadline: deadline, deadlineWarned: false, acceptedPartnerId: null,
      requests: d.partners.map(buildReq), shifts: BN.clone(d.shifts),
      attachments: d.attachments.map((a) => ({ name: a.name, size: a.size, by: me().name, at: BN.nowIso() })),
      history: [], thread: [], department: 'Oslo', flag: null, priceProposal: null, createdBy: BN.S.userId, submittedAt: BN.nowIso(),
    };
    BN.S.trips.push(t);
    t.requests.forEach((r) => {
      if (r.overridden) BN.hist(t, 'price', 'Offer price overridden', cname(r.partnerId) + ': calculated ' + money(r.calc, t.currency) + ' → ' + money(r.offer, t.currency), 'HOST');
    });
    BN.hist(t, 'status', 'Request submitted', 'Shared with ' + d.partners.map(cname).join(', '));
    t.requests.forEach((r) => BN.notify(r.partnerId, ['PCOORD'], 'N-01', cname(cid) + ' shared trip ' + t.id + ' (' + fmtDT(startIso) + ', ' + BN.routeText(t).split(' → ').map((x) => x.split(',')[0]).join(' → ') + '). Respond by ' + fmtDT(deadline) + '.', '#/trips/' + t.id, ['In-app', 'Email', 'Push']));
    if (f.draftId) BN.S.drafts = BN.S.drafts.filter((x) => x.id !== f.draftId);
    f.done = { tripId: id, partners: d.partners.slice(), edited: false };
    return null;
  };

  /* ---------- rendering ---------- */
  function fieldWrap(label, id, control, err, o) {
    o = o || {};
    return '<div class="field' + (o.wide ? ' wide' : '') + (err ? ' has-err' : '') + '"><label for="' + id + '">' + esc(label) + (o.req ? ' <span class="req">*</span>' : '') + '</label>' +
      control + (o.hint ? '<p class="hint">' + esc(o.hint) + '</p>' : '') + (err ? '<p class="err" id="' + id + '-err">' + esc(err) + '</p>' : '') + '</div>';
  }
  const fid = (p) => 'f-' + p.replace(/[^\w]/g, '-');
  function fInput(label, path, value, o) {
    o = o || {}; const id = fid(path), err = BN.S.form.errors[path];
    const ctl = '<input id="' + id + '" data-bind="' + path + '" type="' + (o.type || 'text') + '" value="' + esc(value) + '"' +
      (o.list ? ' list="' + o.list + '"' : '') + (o.max ? ' maxlength="' + o.max + '"' : '') + (o.rerender ? ' data-rerender="1"' : '') +
      (err ? ' aria-invalid="true" aria-describedby="' + id + '-err"' : '') + '>';
    return fieldWrap(label, id, ctl, err, o);
  }
  function fSelect(label, path, value, options, o) {
    o = o || {}; const id = fid(path), err = BN.S.form.errors[path];
    const ctl = '<select id="' + id + '" data-bind="' + path + '"' + (o.rerender ? ' data-rerender="1"' : '') + '>' +
      options.map((x) => '<option value="' + esc(x[0]) + '"' + (String(x[0]) === String(value) ? ' selected' : '') + '>' + esc(x[1]) + '</option>').join('') + '</select>';
    return fieldWrap(label, id, ctl, err, o);
  }
  function fArea(label, path, value, o) {
    o = o || {}; const id = fid(path), err = BN.S.form.errors[path];
    return fieldWrap(label, id, '<textarea id="' + id + '" data-bind="' + path + '" rows="' + (o.rows || 2) + '" maxlength="2000">' + esc(value) + '</textarea>', err, o);
  }
  function errSummary() {
    const e = BN.S.form.errors, keys = Object.keys(e);
    if (!keys.length) return '';
    return '<div class="err-summary" role="alert"><h2>Check these before you continue</h2><ul>' +
      keys.map((k) => '<li><button class="btn-link" data-act="focus-field" data-id="' + fid(k) + '">' + esc(e[k]) + '</button></li>').join('') + '</ul></div>';
  }

  function step1(d) {
    const customers = BN.S.customers.filter((c) => c.companyId === myCid());
    const teq = D.teqTrips.filter((x) => x.companyId === myCid());
    // Route as an itinerary in travel order (SCREENS S-03: From · Via stops · To), drawn with the route-line motif.
    const itRow = (kind, field, actions) => '<li class="it-row it-' + kind + '"><span class="it-mark" aria-hidden="true"></span>' + field +
      '<div class="it-actions">' + (actions || '') + '</div></li>';
    const vias = d.vias.map((v, i) => itRow('via', fInput('Via stop ' + (i + 1), 'vias.' + i, v, { list: 'addr' }),
      '<button class="btn btn-secondary btn-sm" data-act="via-move" data-i="' + i + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + ' aria-label="Move via stop ' + (i + 1) + ' up">↑</button>' +
      '<button class="btn btn-secondary btn-sm" data-act="via-move" data-i="' + i + '" data-dir="1"' + (i === d.vias.length - 1 ? ' disabled' : '') + ' aria-label="Move via stop ' + (i + 1) + ' down">↓</button>' +
      '<button class="btn btn-secondary btn-sm" data-act="via-remove" data-i="' + i + '" aria-label="Remove via stop ' + (i + 1) + '">×</button>')).join('');
    const shifts = d.shifts.map((sh, si) => '<div class="shift">' + fInput('Shift name', 'shifts.' + si + '.name', sh.name, { req: true }) +
      sh.subTrips.map((st, ti) => '<div class="subtrip">' + fInput('From', 'shifts.' + si + '.subTrips.' + ti + '.from', st.from, { list: 'addr' }) +
        fInput('To', 'shifts.' + si + '.subTrips.' + ti + '.to', st.to, { list: 'addr' }) +
        fInput('Start', 'shifts.' + si + '.subTrips.' + ti + '.start', st.start, { type: 'datetime-local' }) +
        fInput('End', 'shifts.' + si + '.subTrips.' + ti + '.end', st.end, { type: 'datetime-local' }) +
        '<button class="btn btn-secondary btn-sm" data-act="subtrip-remove" data-si="' + si + '" data-ti="' + ti + '">Remove</button></div>').join('') +
      '<button class="btn btn-secondary btn-sm" style="margin-top:8px" data-act="subtrip-add" data-si="' + si + '">Add sub-trip</button> ' +
      '<button class="btn btn-secondary btn-sm" style="margin-top:8px" data-act="shift-remove" data-si="' + si + '">Remove shift</button></div>').join('');
    return (teq.length && BN.S.form.mode === 'new' ? '<section class="card form-card"><h2 class="section">Start from a TEQ trip</h2>' +
      '<label class="tf"><span>Prefill from TEQ trip</span><select data-change="prefill"><option value="">— blank form —</option>' +
      teq.map((x) => '<option value="' + x.id + '"' + (d.source === x.id ? ' selected' : '') + '>' + x.id + ' · ' + esc(x.from.split(',')[0]) + ' → ' + esc(x.to.split(',')[0]) + ' · ' + fmtD(x.start) + '</option>').join('') + '</select></label></section>' : '') +
      '<section class="card form-card"><h2 class="section">Trip</h2><div class="grid-3">' +
      '<fieldset class="field"><legend>Trip type <span class="req">*</span></legend><div class="seg">' +
      [['NORMAL', 'Normal'], ['FIXED', 'Fixed']].map((x) => '<label><input type="radio" name="type" data-bind="type" data-rerender="1" value="' + x[0] + '"' + (d.type === x[0] ? ' checked' : '') + '> ' + x[1] + '</label>').join('') + '</div></fieldset>' +
      '<div class="field"><label class="check"><input type="checkbox" data-bind="roundTrip" data-rerender="1"' + (d.roundTrip ? ' checked' : '') + '> Round trip</label></div>' +
      (d.type === 'FIXED' ? '<div class="field"><label class="check"><input type="checkbox" data-bind="paxOff" data-rerender="1"' + (d.paxOff ? ' checked' : '') + '> Passenger count turned off</label></div>' : '') +
      '</div></section>' +
      '<section class="card form-card"><h2 class="section">Customer</h2><div class="grid-3">' +
      fSelect('Customer', 'customerId', d.customerId, [['', '— choose —']].concat(customers.map((c) => [c.id, c.name])), { req: true, rerender: true }) +
      '<div class="field"><label>Contact person</label><input value="' + esc((customers.find((c) => c.id === d.customerId) || {}).contact || '') + '" readonly></div>' +
      '<div class="field"><label for="new-cust">New customer</label><button class="btn btn-secondary" id="new-cust" data-act="new-customer">+ Create customer</button></div>' +
      '</div></section>' +
      '<section class="card form-card"><h2 class="section">Route</h2>' +
      '<p class="muted small route-intro">Start typing and choose an address from the suggestions (Google Maps). Add up to 8 via stops between start and destination.</p>' +
      '<ol class="itinerary" aria-label="Route stops in travel order">' +
      itRow('from', fInput('Travel from', 'from', d.from, { req: true, list: 'addr', rerender: true })) + vias +
      '<li class="it-add"><span class="it-mark" aria-hidden="true"></span><div class="it-add-body">' +
      '<button class="btn btn-secondary btn-sm" data-act="via-add"' + (d.vias.length >= 8 ? ' disabled' : '') + '>+ Add via stop</button>' +
      '<span class="muted small">' + d.vias.length + ' of 8 via stops used</span></div></li>' +
      itRow('to', fInput('Travel to', 'to', d.to, { req: true, list: 'addr', rerender: true })) +
      '</ol></section>' +
      '<section class="card form-card"><h2 class="section">Schedule</h2><div class="grid-3">' +
      fInput('Planned start', 'start', d.start, { req: true, type: 'datetime-local' }) +
      fInput('Planned end', 'end', d.end, { req: true, type: 'datetime-local' }) +
      (d.roundTrip ? fInput('Return date/time', 'ret', d.ret, { req: true, type: 'datetime-local' }) : '') + '</div></section>' +
      '<section class="card form-card"><h2 class="section">Passengers &amp; vehicle</h2><div class="grid-3">' +
      (d.type === 'FIXED' && d.paxOff ? '' : fInput('PAX', 'pax', d.pax, { req: true, type: 'number' })) +
      fSelect('Vehicle type', 'vehicle.type', d.vehicle.type, [['', '— any —']].concat(D.vehicleTypes.map((v) => [v.id, v.name + ' (' + v.seats + ' seats)'])), { rerender: true }) +
      fInput('Euro class', 'vehicle.euro', d.vehicle.euro) + fInput('Fuel type', 'vehicle.fuel', d.vehicle.fuel) +
      fInput('Luggage', 'vehicle.luggage', d.vehicle.luggage) + fInput('Other requirements', 'vehicle.other', d.vehicle.other) + '</div></section>' +
      (d.type === 'FIXED' ? '<section class="card form-card"><h2 class="section">Shifts</h2>' + (BN.S.form.errors.shifts ? '<p class="err">' + esc(BN.S.form.errors.shifts) + '</p>' : '') + shifts +
        '<button class="btn btn-secondary btn-sm" data-act="shift-add">Add shift</button></section>' : '') +
      '<section class="card form-card"><h2 class="section">References</h2><div class="grid-3">' +
      fInput('Flight no.', 'flightNo', d.flightNo, { max: 100 }) + fInput('Group ref.', 'groupRef', d.groupRef, { max: 100 }) + fInput('Sign', 'sign', d.sign, { max: 100 }) + '</div></section>' +
      '<section class="card form-card"><h2 class="section">Comments</h2><div class="grid-2">' +
      fArea('Comment to partner', 'comments.partner', d.comments.partner) + fArea('Comment to driver', 'comments.driver', d.comments.driver) +
      fArea('HQ comment (internal)', 'comments.hq', d.comments.hq) + fArea('Invoice comment', 'comments.invoiceComment', d.comments.invoiceComment) +
      fInput('Invoice reference', 'comments.invoiceRef', d.comments.invoiceRef, { max: 100 }) + '</div></section>' +
      '<section class="card form-card"><h2 class="section">Attachments</h2>' +
      '<input type="file" id="attach" multiple accept=".pdf,.jpg,.jpeg,.png,.docx"> <span class="muted small">Up to 2 files, 10 MB each (PDF, JPG, PNG, DOCX).</span>' +
      (BN.S.form.errors.attachments ? '<p class="err">' + esc(BN.S.form.errors.attachments) + '</p>' : '') +
      (d.attachments.length ? '<ul class="attach-list">' + d.attachments.map((a, i) => '<li><span>' + esc(a.name) + '</span><span>' + Math.round(a.size / 1024) + ' kB <button class="btn-link" data-act="attach-remove" data-i="' + i + '">Remove</button></span></li>').join('') + '</ul>' : '') +
      '</section>';
  }

  function step2(d) {
    const cid = myCid();
    const list = D.affiliations.filter((a) => a.hostId === cid && a.state === 'ACCEPTED')
      .filter((a) => !d.search || cname(a.partnerId).toLowerCase().indexOf(d.search.toLowerCase()) !== -1)
      .sort((a, b) => (d.sortDir === 'asc' ? 1 : -1) * cname(a.partnerId).localeCompare(cname(b.partnerId)));
    return '<section class="card form-card"><h2 class="section">Select partners</h2>' +
      (BN.S.form.errors.partners ? '<p class="err">' + esc(BN.S.form.errors.partners) + '</p>' : '') +
      '<div class="toolbar" style="border:0;padding-left:0"><label class="tf"><span>Search</span><input type="search" data-bind="search" data-rerender="1" value="' + esc(d.search) + '" placeholder="Partner name"></label>' +
      '<label class="tf"><span>Sort</span><select data-bind="sortDir" data-rerender="1"><option value="asc"' + (d.sortDir === 'asc' ? ' selected' : '') + '>Name A–Z</option><option value="desc"' + (d.sortDir === 'desc' ? ' selected' : '') + '>Name Z–A</option></select></label></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th><span class="sr-only">Select</span></th><th>Partner</th><th>Category</th><th>Price agreement</th><th>Rate</th></tr></thead><tbody>' +
      list.map((a) => '<tr><td><label class="check"><input type="checkbox" data-act="toggle-partner" data-pid="' + a.partnerId + '"' + (d.partners.indexOf(a.partnerId) !== -1 ? ' checked' : '') + '><span class="sr-only">Select ' + esc(cname(a.partnerId)) + '</span></label></td>' +
        '<td>' + esc(cname(a.partnerId)) + '</td><td>' + esc(a.category) + '</td><td>' + AGREEMENT_LABEL[a.agreement.type] + '</td>' +
        '<td class="num">' + (a.agreement.type === 'PERCENTAGE' ? a.agreement.rate + ' %' : a.agreement.rate ? money(a.agreement.rate, 'NOK') : '—') + '</td></tr>').join('') +
      '</tbody></table></div>' +
      (list.length ? '' : '<div class="empty"><p>No accepted partners match. Partnerships are set up in BusNetwork Settings.</p></div>') +
      '<p class="muted small">' + d.partners.length + ' partner' + (d.partners.length === 1 ? '' : 's') + ' selected. Only partners you have an active agreement with are listed.</p></section>';
  }

  function step3(d) {
    const cur = BN.company(myCid()).currency;
    const rows = d.partners.map((pid) => {
      const o = BN.formOffer(pid), p = d.prices[pid] || { override: '', costs: [] };
      const err = BN.S.form.errors['offer.' + pid];
      return '<tr' + (err ? ' class="needs"' : '') + '><td>' + esc(cname(pid)) + '</td>' +
        '<td>' + AGREEMENT_LABEL[o.agreement.type] + (o.agreement.type === 'PERCENTAGE' ? ' ' + o.agreement.rate + '%' : '') + '</td>' +
        '<td class="num">' + (o.calc === null ? '<span class="muted">Enter a customer price</span>' : money(o.calc, cur)) + '</td>' +
        '<td class="num"><input data-bind="prices.' + pid + '.override" data-rerender="1" value="' + esc(p.override) + '" placeholder="' + (o.calc === null ? '' : (o.calc / 100).toFixed(2)) + '" aria-label="Offer price for ' + esc(cname(pid)) + '">' +
        (o.overridden ? '<span class="override">Calculated ' + money(o.calc, cur) + ' · overridden by ' + esc(me().name) + ' · <button class="btn-link" data-act="reset-price" data-pid="' + pid + '">Reset</button></span>' : '') +
        (err ? '<span class="err">' + esc(err) + '</span>' : '') + '</td>' +
        '<td>' + p.costs.map((c, i) => '<div class="cost-row"><input data-bind="prices.' + pid + '.costs.' + i + '.desc" value="' + esc(c.desc) + '" placeholder="Description" aria-label="Additional cost description">' +
          '<input data-bind="prices.' + pid + '.costs.' + i + '.amount" data-rerender="1" value="' + esc(c.amount) + '" placeholder="0.00" aria-label="Additional cost amount">' +
          '<button class="btn-link" data-act="cost-remove" data-pid="' + pid + '" data-i="' + i + '">Remove</button></div>').join('') +
        '<button class="btn btn-secondary btn-sm" data-act="cost-add" data-pid="' + pid + '">Add cost</button></td></tr>';
    }).join('');
    return '<section class="card form-card"><h2 class="section">Set price</h2><div class="grid-3">' +
      fInput('Customer price (' + cur + ')', 'customerPrice', d.customerPrice, { rerender: true, hint: 'What the host charges its own customer. Never shown to partners.' }) +
      fInput('Response deadline', 'deadline', d.deadline, { type: 'datetime-local', hint: 'Defaults to the planned start if left empty.' }) + '</div>' +
      '<div class="tbl-wrap"><table class="price-table"><thead><tr><th>Partner</th><th>Agreement</th><th>Calculated</th><th>Offer price</th><th>Additional costs</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="muted small">Offer prices are rounded to 2 decimals. For a percentage agreement, the offer price is the customer price × the rate.</p></section>';
  }

  function step4(d) {
    const cur = BN.company(myCid()).currency;
    const card = (title, stepNo, body) => '<section class="card form-card review-card"><header><h2 class="section">' + title + '</h2><button class="btn-link" data-act="goto-step" data-step="' + stepNo + '">Edit</button></header>' + body + '</section>';
    const cust = BN.S.customers.find((c) => c.id === d.customerId) || {};
    return card('Trip', 1, '<dl class="dl">' + BN.components.dlRow('Type', d.type) + BN.components.dlRow('Customer', esc(cust.name || '')) +
      BN.components.dlRow('Planned start', fmtDT(BN.localToIso(d.start))) + BN.components.dlRow('Planned end', fmtDT(BN.localToIso(d.end))) +
      BN.components.dlRow('PAX', d.pax || '—') + BN.components.dlRow('Vehicle', esc(BN.vehicleName(d.vehicle.type))) + '</dl>') +
      card('Route', 1, '<ul class="stops">' + [d.from].concat(d.vias, [d.to]).map((a, i, arr) => '<li' + (i === arr.length - 1 ? ' class="end"' : '') + '>' + esc(a) + '</li>').join('') + '</ul>') +
      card('Partners &amp; prices', 3, '<div class="tbl-wrap"><table><thead><tr><th>Partner</th><th>Offer price</th><th>Additional costs</th></tr></thead><tbody>' +
        d.partners.map((pid) => { const o = BN.formOffer(pid); return '<tr><td>' + esc(cname(pid)) + '</td><td class="num">' + money(o.offer, cur) + (o.overridden ? ' <span class="override">overridden</span>' : '') + '</td><td class="num">' + (o.costs.length ? o.costs.map((c) => esc(c.desc) + ' ' + money(parseMoney(c.amount), cur)).join('<br>') : '—') + '</td></tr>'; }).join('') +
        '</tbody></table></div><p class="muted small">Customer price ' + money(parseMoney(d.customerPrice), cur) + ' · deadline ' + (d.deadline ? fmtDT(BN.localToIso(d.deadline)) : fmtDT(BN.localToIso(d.start)) + ' (planned start)') + '</p>') +
      card('Comments &amp; attachments', 1, '<dl class="dl">' + BN.components.dlRow('To partner', esc(d.comments.partner)) + BN.components.dlRow('To driver', esc(d.comments.driver)) +
        BN.components.dlRow('Attachments', d.attachments.length ? d.attachments.map((a) => esc(a.name)).join('<br>') : '—') + '</dl>');
  }

  BN.pageRequest = function (r) {
    if (!can('createRequest')) return '<div class="card empty"><p>Your role can’t create requests.</p></div>';
    const f = BN.S.form;
    if (f.done) {
      const d = f.done;
      return '<div class="card success"><h1 class="page-title">' + (d.edited ? 'Request updated' : 'Request sent to ' + d.partners.length + ' partner' + (d.partners.length === 1 ? '' : 's')) + '</h1>' +
        '<span class="big-id">' + d.tripId + '</span>' +
        '<p class="muted">Marked as shared on TEQ trip ' + d.tripId + ' · the trip is linked in both places.</p>' +
        '<p><a class="btn btn-primary" href="#/trips/' + d.tripId + '">Open the trip</a> <a class="btn btn-secondary" href="#/trips/active">Open in Active Trips</a> ' +
        '<button class="btn btn-secondary" data-act="new-request">Create another request</button></p></div>';
    }
    const d = f.data;
    const steps = [[1, 'Trip details'], [2, 'Select partners'], [3, 'Set price'], [4, 'Review & submit']];
    const stepper = '<ol class="stepper">' + steps.map((s) => '<li class="' + (f.step === s[0] ? 'cur' : (s[0] < f.step || s[0] <= f.maxStep ? 'done' : '')) + '">' +
      '<button data-act="goto-step" data-step="' + s[0] + '"' + (s[0] > f.maxStep ? ' disabled' : '') + '><small>Step ' + s[0] + '</small>' + s[1] + '</button></li>').join('') + '</ol>';
    const body = f.step === 1 ? step1(d) : f.step === 2 ? step2(d) : f.step === 3 ? step3(d) : step4(d);
    const drafts = (f.mode === 'new' && BN.S.drafts.length && f.step === 1)
      ? '<section class="card form-card"><h2 class="section">My drafts (' + BN.S.drafts.length + ')</h2><div class="tbl-wrap"><table><thead><tr><th>Last edited</th><th>Type</th><th>Route</th><th>Step</th><th>Actions</th></tr></thead><tbody>' +
      BN.S.drafts.map((x) => '<tr><td class="nowrap">' + fmtDT(x.at) + '</td><td>' + x.data.type + '</td><td>' + esc((x.data.from || '—').split(',')[0] + ' → ' + (x.data.to || '—').split(',')[0]) + '</td><td>' + x.step + '</td>' +
        '<td><button class="btn btn-secondary btn-sm" data-act="draft-open" data-id="' + x.id + '">Open</button> <button class="btn btn-secondary btn-sm" data-act="draft-delete" data-id="' + x.id + '">Delete</button></td></tr>').join('') + '</tbody></table></div></section>'
      : '';
    return '<div class="page-head"><h1 class="page-title">' + (f.mode === 'edit' ? 'Edit request · Trip ' + f.tripId : 'New request') + '</h1></div>' +
      errSummary() +
      '<div class="form-layout">' + stepper + '<div>' + drafts + body +
      '<div class="form-foot"><div><button class="btn btn-secondary" data-act="save-draft">Save draft</button></div>' +
      '<div class="row-actions">' + (f.step > 1 ? '<button class="btn btn-secondary" data-act="step-back">Back</button>' : '') +
      (f.step < 4 ? '<button class="btn btn-primary" data-act="step-next">Next</button>' : '<button class="btn btn-primary" data-act="submit-request">' + (f.mode === 'edit' ? 'Save changes' : 'Submit request') + '</button>') +
      '</div></div></div></div>';
  };
})(window.BN);

  <script>
/* ===== app-invoices.js ===== */
/* BusNetwork portal prototype — Invoice List (S-07) and Invoice (S-08). BN-INV-01..10, BN-CLS-04/05. */
(function (BN) {
  'use strict';
  const { esc, fmtDT, fmtD, money, moneyInput, cname, can, myCid, INV_LABEL } = BN;
  const ARCHIVE_DAYS = 90;

  function dirOf(i) { return i.recipientId === myCid() ? 'Incoming' : 'Outgoing'; }
  function isArchived(i) {
    return (i.status === 'APPROVED' || i.status === 'DECLINED') && i.decidedAt && BN.S.now - Date.parse(i.decidedAt) > ARCHIVE_DAYS * BN.DAY;
  }
  function visibleInvoices() {
    const cid = myCid();
    return BN.latestInvoices().filter((i) => (i.issuerId === cid || i.recipientId === cid) && !(i.status === 'DRAFT' && i.issuerId !== cid));
  }
  function queryInvoices(tab, q) {
    const cid = myCid();
    let rows = visibleInvoices().filter((i) => {
      if (tab === 'archive') return isArchived(i);
      if (isArchived(i)) return false;
      return tab === 'incoming' ? i.recipientId === cid : i.issuerId === cid;
    });
    const s = (q.get('q') || '').trim().toLowerCase();
    if (s) rows = rows.filter((i) => [i.no, i.tripId, cname(i.issuerId), cname(i.recipientId)].some((x) => String(x).toLowerCase().indexOf(s) !== -1));
    const st = (q.get('status') || '').split(',').filter(Boolean);
    if (st.length) rows = rows.filter((i) => st.indexOf(i.status) !== -1);
    const co = q.get('company');
    if (co) rows = rows.filter((i) => (i.recipientId === cid ? i.issuerId : i.recipientId) === co);
    const tf = q.get('from'), tt = q.get('to');
    if (tf || tt) {
      rows = rows.filter((i) => {
        const t = BN.tripById(i.tripId); if (!t) return false;
        const ms = Date.parse(t.plannedStart);
        return (!tf || ms >= BN.dayStartUtc(tf)) && (!tt || ms <= BN.dayEndUtc(tt));
      });
    }
    const inf = q.get('invFrom'), int_ = q.get('invTo');
    if (inf || int_) {
      rows = rows.filter((i) => { const ms = Date.parse(i.submittedAt || i.createdAt); return (!inf || ms >= BN.dayStartUtc(inf)) && (!int_ || ms <= BN.dayEndUtc(int_)); });
    }
    const sort = (q.get('sort') || 'tripdate:desc').split(':'), dir = sort[1] === 'asc' ? 1 : -1;
    const keys = {
      no: (i) => i.no, total: (i) => BN.invTotals(i).total,
      tripdate: (i) => { const t = BN.tripById(i.tripId); return t ? Date.parse(t.plannedStart) : 0; },
      submitted: (i) => Date.parse(i.submittedAt || i.createdAt),
    };
    const k = keys[sort[0]] || keys.tripdate;
    return rows.slice().sort((a, b) => (k(a) > k(b) ? 1 : k(a) < k(b) ? -1 : 0) * dir);
  }

  function invActions(i) {
    const cid = myCid(), out = [];
    if (i.recipientId === cid && i.status === 'PENDING' && can('invoiceDecide')) {
      out.push('<button class="btn btn-primary btn-sm" data-act="inv-approve" data-no="' + i.no + '">Approve</button>');
      out.push('<button class="btn btn-danger btn-sm" data-act="inv-decline" data-no="' + i.no + '">Decline</button>');
    }
    if (i.issuerId === cid && can('invoiceIssue')) {
      if (i.status === 'DRAFT') out.push('<button class="btn btn-primary btn-sm" data-act="inv-submit" data-no="' + i.no + '">Submit</button>');
      if (i.status === 'DECLINED') out.push('<button class="btn btn-primary btn-sm" data-act="inv-resubmit" data-no="' + i.no + '">Edit &amp; resubmit</button>');
    }
    out.push('<a class="btn btn-secondary btn-sm" href="#/invoices/' + i.no + '">View</a>');
    return out.join(' ');
  }

  BN.pageInvoices = function (tab, r) {
    if (!can('invoiceDecide') && !can('invoiceIssue')) return '<div class="card empty"><p>Your role can’t open the Invoice List.</p></div>';
    const q = r.q, cid = myCid();
    const rows = queryInvoices(tab, q);
    const size = +(q.get('size') || 25), page = Math.max(1, +(q.get('page') || 1));
    const slice = rows.slice((page - 1) * size, (page - 1) * size + size);
    const sort = q.get('sort') || 'tripdate:desc';
    const sel = (q.get('status') || '').split(',').filter(Boolean);
    const counterIds = {};
    visibleInvoices().forEach((i) => { counterIds[i.recipientId === cid ? i.issuerId : i.recipientId] = 1; });
    const pendingIncoming = visibleInvoices().filter((i) => i.recipientId === cid && i.status === 'PENDING' && !isArchived(i)).length;
    const totals = rows.reduce((a, i) => { const t = BN.invTotals(i); a.net += t.net; a.vat += t.vat; a.total += t.total; return a; }, { net: 0, vat: 0, total: 0 });
    const open = BN.S.openDetails.status ? ' open' : '';
    const toolbar = '<div class="toolbar"><div class="tb-row">' +
      '<label class="tf tf-grow"><span>Search</span><input type="search" data-filter="q" value="' + esc(q.get('q') || '') + '" placeholder="Invoice no., trip ID, company"></label>' +
      '<div class="tf"><span>Status</span><details class="dropdown" data-keep="status"' + open + '><summary>Status' + (sel.length ? ' (' + sel.length + ')' : '') + ' ▾</summary><div class="panel">' +
      ['DRAFT', 'PENDING', 'APPROVED', 'DECLINED'].map((s) => '<label class="check"><input type="checkbox" data-filter="status" data-value="' + s + '"' + (sel.indexOf(s) !== -1 ? ' checked' : '') + '> ' + INV_LABEL[s] + '</label>').join('') + '</div></details></div>' +
      '<label class="tf"><span>Company</span><select data-filter="company"><option value="">All companies</option>' +
      Object.keys(counterIds).map((id) => '<option value="' + id + '"' + (q.get('company') === id ? ' selected' : '') + '>' + esc(cname(id)) + '</option>').join('') + '</select></label>' +
      BN.components.exportMenu('invoices') + '</div>' +
      '<div class="tb-row tb-row-2">' + BN.components.dateRange('Trip date', 'from', 'to', q) + BN.components.dateRange('Invoice date', 'invFrom', 'invTo', q) + '</div>' +
      '</div>' + BN.components.chips(q);
    const head = '<tr>' + BN.components.th('Invoice no.', 'no', sort) + BN.components.th('Direction') + BN.components.th('Trip ID') + BN.components.th('Company') +
      (tab === 'incoming' ? BN.components.th('Customer') : '') + BN.components.th('Trip date', 'tripdate', sort) +
      BN.components.th('Excl. VAT') + BN.components.th('VAT') + BN.components.th('Total', 'total', sort) + BN.components.th('Status') +
      BN.components.th('Submitted', 'submitted', sort) + BN.components.th('Decided') + BN.components.th('Actions') + '</tr>';
    const body = slice.map((i) => {
      const t = BN.tripById(i.tripId), tt = BN.invTotals(i), cust = t ? BN.customerOf(t) : { name: '—' };
      const other = i.recipientId === cid ? i.issuerId : i.recipientId;
      return '<tr class="row" tabindex="0" data-act="open" data-href="#/invoices/' + i.no + '">' +
        '<td class="id">' + i.no + (i.version > 1 ? ' <span class="tag">v' + i.version + '</span>' : '') + '</td>' +
        '<td>' + dirOf(i) + '</td><td class="id">' + i.tripId + '</td><td>' + esc(cname(other)) + '</td>' +
        (tab === 'incoming' ? '<td>' + esc(cust.name) + '</td>' : '') +
        '<td class="nowrap">' + (t ? fmtD(t.plannedStart) : '—') + '</td>' +
        '<td class="num">' + BN.num(tt.net) + '</td><td class="num">' + BN.num(tt.vat) + '</td><td class="num">' + BN.num(tt.total) + '</td>' +
        '<td>' + BN.components.invPill(i.status) + '</td>' +
        '<td class="nowrap">' + (i.submittedAt ? fmtD(i.submittedAt) : '—') + '</td>' +
        '<td class="nowrap">' + (i.decidedAt ? fmtD(i.decidedAt) : '—') + '</td>' +
        '<td><div class="row-actions">' + invActions(i) + '</div></td></tr>';
    }).join('');
    const cols = tab === 'incoming' ? 13 : 12;
    const foot = rows.length ? '<tfoot><tr><td colspan="' + (tab === 'incoming' ? 6 : 5) + '">Totals for ' + rows.length + ' invoices</td>' +
      '<td class="num">' + BN.num(totals.net) + '</td><td class="num">' + BN.num(totals.vat) + '</td><td class="num">' + BN.num(totals.total) + '</td><td colspan="4"></td></tr></tfoot>' : '';
    const subtabs = ['incoming', 'outgoing', 'archive'].map((x) => '<a href="#/invoices/' + x + '" class="' + (tab === x ? 'on' : '') + '">' + x.charAt(0).toUpperCase() + x.slice(1) +
      (x === 'incoming' && pendingIncoming ? ' <span class="badge warn">' + pendingIncoming + '</span>' : '') + '</a>').join('');
    return '<div class="page-head"><h1 class="page-title">Invoice List<span class="count">' + rows.length + ' invoices</span></h1></div>' +
      '<div class="card" style="padding:0"><div class="subtabs">' + subtabs + '</div>' + toolbar +
      (rows.length ? '<div class="tbl-wrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody>' + foot + '</table></div>' + BN.components.pager(rows.length, page, size)
        : BN.components.emptyState('invoices', q)) + '</div>' +
      (tab === 'archive' ? '<p class="muted small">Archive holds Approved and Declined invoices decided more than ' + ARCHIVE_DAYS + ' days ago.</p>' : '');
  };

  BN.pageInvoice = function (no, r) {
    const versions = BN.invoiceVersions(no);
    if (!versions.length) return '<div class="page-head"><h1 class="page-title">Invoice not found</h1></div><div class="card empty"><p>Invoice ' + esc(no) + ' doesn’t exist or isn’t yours.</p><a class="btn btn-secondary" href="#/invoices/incoming">Go to Invoice List</a></div>';
    const vParam = r.q.get('v');
    const inv = (vParam && versions.find((x) => String(x.version) === vParam)) || versions[versions.length - 1];
    const cid = myCid();
    if (inv.issuerId !== cid && inv.recipientId !== cid) return '<div class="card empty"><p>Invoice not found.</p></div>';
    if (inv.status === 'DRAFT' && inv.issuerId !== cid) return '<div class="card empty"><p>Invoice not found.</p></div>';
    const t = BN.tripById(inv.tripId);
    const issuer = BN.company(inv.issuerId), recipient = BN.company(inv.recipientId);
    const editable = inv.status === 'DRAFT' && inv.issuerId === cid && can('invoiceIssue');
    const lines = inv.snapshot || inv.lines;
    const totals = BN.invTotals(inv);
    const lineRows = lines.map((l, i) => {
      const c = BN.lineCalc(l);
      return '<tr>' + (editable
        ? '<td><input data-invline="' + i + '.desc" value="' + esc(l.desc) + '" aria-label="Description line ' + (i + 1) + '"></td>' +
          '<td class="num"><input data-invline="' + i + '.qty" value="' + esc(l.qty) + '" aria-label="Quantity line ' + (i + 1) + '"></td>' +
          '<td class="num"><input data-invline="' + i + '.unit" value="' + moneyInput(l.unit) + '" aria-label="Unit price line ' + (i + 1) + '"></td>' +
          '<td class="num"><input data-invline="' + i + '.vat" value="' + esc(l.vat) + '" aria-label="VAT percent line ' + (i + 1) + '"></td>'
        : '<td>' + esc(l.desc) + '</td><td class="num">' + esc(l.qty) + '</td><td class="num">' + BN.num(l.unit) + '</td><td class="num">' + esc(l.vat) + ' %</td>') +
        '<td class="num">' + BN.num(c.net) + '</td><td class="num">' + BN.num(c.vat) + '</td>' +
        (editable ? '<td><button class="btn-link" data-act="line-remove" data-no="' + inv.no + '" data-v="' + inv.version + '" data-i="' + i + '">Remove</button></td>' : '<td></td>') + '</tr>';
    }).join('');
    const actions = [];
    if (editable) actions.push('<button class="btn btn-primary" data-act="inv-submit" data-no="' + inv.no + '">Submit invoice</button>',
      '<button class="btn btn-secondary" data-act="line-add" data-no="' + inv.no + '" data-v="' + inv.version + '">Add line</button>',
      '<button class="btn btn-danger" data-act="inv-delete" data-no="' + inv.no + '" data-v="' + inv.version + '">Delete draft</button>');
    if (inv.status === 'PENDING' && inv.recipientId === cid && can('invoiceDecide')) actions.push('<button class="btn btn-primary" data-act="inv-approve" data-no="' + inv.no + '">Approve</button>', '<button class="btn btn-danger" data-act="inv-decline" data-no="' + inv.no + '">Decline</button>');
    if (inv.status === 'DECLINED' && inv.issuerId === cid && can('invoiceIssue') && inv.version === versions[versions.length - 1].version) actions.push('<button class="btn btn-primary" data-act="inv-resubmit" data-no="' + inv.no + '">Edit &amp; resubmit</button>');
    actions.push('<button class="btn btn-secondary" data-act="inv-pdf">Download PDF</button>');
    return '<a class="back" href="#/invoices/' + (inv.recipientId === cid ? 'incoming' : 'outgoing') + '">← Back to Invoice List</a>' +
      '<div class="page-head"><div><div class="dh-row"><h1 class="page-title"><span class="mono">' + inv.no + '</span></h1>' + BN.components.invPill(inv.status) +
      '<span class="tag">v' + inv.version + '</span><span class="tag">' + dirOf(inv) + '</span></div>' +
      '<p class="muted">Trip <a href="#/trips/' + inv.tripId + '">' + inv.tripId + '</a> · ' + esc(cname(inv.issuerId)) + ' → ' + esc(cname(inv.recipientId)) + '</p></div>' +
      '<div class="row-actions no-print">' + actions.join(' ') + '</div></div>' +
      (versions.length > 1 ? '<div class="versions no-print">' + versions.map((x) => '<a class="chip quick' + (x.version === inv.version ? ' on' : '') + '" href="#/invoices/' + inv.no + '?v=' + x.version + '">v' + x.version + ' · ' + INV_LABEL[x.status] + '</a>').join('') + '</div>' : '') +
      (inv.status === 'DECLINED' ? '<div class="banner error"><div><strong>Declined</strong> by ' + esc(inv.decidedBy || '') + ' on ' + fmtD(inv.decidedAt) + ': ' + esc(inv.declineReason || '') + '</div></div>' : '') +
      (inv.status === 'APPROVED' ? '<div class="banner ok"><div><strong>Approved</strong> by ' + esc(inv.decidedBy || '') + ' on ' + fmtD(inv.decidedAt) + '. Amounts were locked at approval.</div></div>' : '') +
      '<div class="stack"><div class="parties">' +
      '<section class="card"><h2 class="section">From (partner)</h2><p>' + esc(issuer.name) + '<br>' + esc(issuer.address) + '<br>Org. no. ' + esc(issuer.orgNo) + '<br>VAT ' + esc(issuer.vatNo) + '</p></section>' +
      '<section class="card"><h2 class="section">To (host)</h2><p>' + esc(recipient.name) + '<br>' + esc(recipient.address) + '<br>Org. no. ' + esc(recipient.orgNo) + '<br>VAT ' + esc(recipient.vatNo) + '</p></section></div>' +
      '<section class="card"><h2 class="section">Lines</h2><div class="tbl-wrap"><table class="lines"><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>VAT %</th><th>Net</th><th>VAT</th><th></th></tr></thead><tbody>' + lineRows + '</tbody></table></div>' +
      '<div class="totals"><div><span>Amount excl. VAT</span><span class="num">' + money(totals.net, inv.currency) + '</span></div>' +
      '<div><span>VAT</span><span class="num">' + money(totals.vat, inv.currency) + '</span></div>' +
      '<div class="grand"><span>Total</span><span class="num">' + money(totals.total, inv.currency) + '</span></div></div></section>' +
      '<section class="card"><h2 class="section">Trip and references</h2><dl class="dl">' +
      BN.components.dlRow('Trip', t ? '<a href="#/trips/' + t.id + '">' + t.id + '</a> · ' + esc(BN.routeText(t)) : inv.tripId) +
      BN.components.dlRow('Trip date', t ? fmtDT(t.plannedStart) : '—') +
      BN.components.dlRow('Invoice reference', t ? esc(t.comments.invoiceRef) : '—') +
      (inv.recipientId === cid && t ? BN.components.dlRow('Customer', esc(BN.customerOf(t).name)) : '') +
      BN.components.dlRow('Created', fmtDT(inv.createdAt)) + BN.components.dlRow('Submitted', inv.submittedAt ? fmtDT(inv.submittedAt) : '—') +
      BN.components.dlRow('Decided', inv.decidedAt ? fmtDT(inv.decidedAt) + ' · ' + esc(inv.decidedBy || '') : '—') + '</dl></section></div>';
  };

  BN.invoiceExportRows = function (tab, q) {
    const cid = myCid();
    const rows = queryInvoices(tab, q);
    const header = ['Invoice no.', 'Version', 'Direction', 'Trip ID', 'Company', 'Customer', 'Trip date (Europe/Oslo)', 'Excl. VAT', 'VAT', 'Total', 'Currency', 'Status', 'Submitted', 'Decided'];
    const body = rows.map((i) => {
      const t = BN.tripById(i.tripId), tt = BN.invTotals(i);
      return [i.no, i.version, dirOf(i), i.tripId, cname(i.recipientId === cid ? i.issuerId : i.recipientId),
        i.recipientId === cid && t ? BN.customerOf(t).name : '', t ? fmtD(t.plannedStart) : '',
        BN.num(tt.net), BN.num(tt.vat), BN.num(tt.total), i.currency, INV_LABEL[i.status],
        i.submittedAt ? fmtD(i.submittedAt) : '', i.decidedAt ? fmtD(i.decidedAt) : ''];
    });
    return [header].concat(body);
  };
  BN.queryInvoices = queryInvoices;
  BN.isArchived = isArchived;
  BN.pendingIncoming = function () {
    const cid = myCid();
    return visibleInvoices().filter((i) => i.recipientId === cid && i.status === 'PENDING' && !isArchived(i)).length;
  };
})(window.BN);

/* ===== app-main.js ===== */
/* BusNetwork portal prototype — shell, routing, modals and events (S-00, S-09, S-10). */
(function (BN) {
  'use strict';
  const { esc, fmtDT, fmtD, fmtLen, money, moneyInput, parseMoney, cname, can, me, myCid, vm,
    STATUS_LABEL, INV_LABEL, ROLE_LABEL, ACTIVE_SET } = BN;
  const D = BN.D;
  const $ = (s, r) => (r || document).querySelector(s);

  /* BusNetwork logo mark (master copy: logo.svg). Inlined so the single-file build keeps it. */
  const LOGO = '<svg class="logo" viewBox="0 0 40 32" aria-hidden="true" focusable="false">' +
    '<path d="M5 6h25.5a4 4 0 0 1 3.7 2.5l2.6 6.6a5 5 0 0 1 .4 1.9V22a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z" fill="#55C4A8"/><path d="M6 9.5h5v5H6zM13 9.5h5v5h-5zM20 9.5h5v5h-5z" fill="#132029"/><path d="M27.5 9.5h2.4a1.5 1.5 0 0 1 1.4 1l1.4 3.5h-5.2z" fill="#132029"/><path d="M2 17.5h35" stroke="#132029" stroke-width="1.4"/><circle cx="10" cy="24" r="4" fill="#132029"/><circle cx="10" cy="24" r="2.2" fill="#E1E8EB"/><circle cx="29" cy="24" r="4" fill="#132029"/><circle cx="29" cy="24" r="2.2" fill="#E1E8EB"/>' +
    '</svg>';

  /* ---------------- routing ---------------- */
  function parseHash() {

  /* ---------------- render ---------------- */
  const ROUTE_TITLE = { dashboard: 'Dashboard', request: 'New request', 'trips/active': 'Active Trips', 'trips/closed': 'Closed Trips', 'trips/all': 'All Trips', invoices: 'Invoice List' };
  function routeKey(r) {
    if (r.parts[0] === 'trips') return ['active', 'closed', 'all'].indexOf(r.parts[1]) !== -1 ? 'trips/' + r.parts[1] : 'trips/detail';
    if (r.parts[0] === 'invoices') return ['incoming', 'outgoing', 'archive'].indexOf(r.parts[1] || 'incoming') !== -1 ? 'invoices' : 'invoices/detail';
    return r.parts[0] || 'dashboard';
  }
  function titleFor(k) { return ROUTE_TITLE[k] || (k === 'trips/detail' ? 'Trip' : k === 'invoices/detail' ? 'Invoice' : 'BusNetwork'); }
  function skeletonKind(k) { return k === 'dashboard' ? 'dashboard' : (k === 'trips/detail' || k === 'invoices/detail' || k === 'request') ? 'detail' : 'list'; }
  function paint(html, key) {
    $('#page').innerHTML = html;
    renderNotif(); renderGuide();
    BN.S.prevHash = location.hash; BN.S.servedKey = key;
  }

  function render() {
    const r = parseHash();
    renderTop(); renderNav(r);
    const S = BN.S, key = routeKey(r);
    let html = '';
    if (S.loading === key) { paint(BN.skeletonFor(skeletonKind(key), titleFor(key)), key); return; }
    if (S.servedKey !== key && (!S.loaded[key] || S.demo.slow)) {
      S.loading = key;
      setTimeout(function () { S.loaded[key] = true; S.loading = null; render(); }, S.demo.slow ? 1500 : 420);
      paint(BN.skeletonFor(skeletonKind(key), titleFor(key)), key);
      return;
    }
    if (S.demo.forceError && ['dashboard', 'invoices', 'trips/active', 'trips/closed', 'trips/all'].indexOf(key) !== -1) {
      paint(BN.errorFor(titleFor(key)), key);
      return;
    }
    try {
      if (r.parts[0] === 'trips' && r.parts[1] && ['active', 'closed', 'all'].indexOf(r.parts[1]) === -1) {
        html = BN.pageTrip(r.parts[1]);
      } else if (r.parts[0] === 'trips') {
        const kind = r.parts[1] || 'active';
        BN.S.lastListKind = kind; BN.S.lastList[kind] = location.hash;
        html = BN.pageTripList(kind, r);
      } else if (r.parts[0] === 'request') {
        if (!BN.S.form) BN.S.form = BN.newForm();
        html = BN.pageRequest(r);
      } else if (r.parts[0] === 'invoices') {
        const seg = r.parts[1] || 'incoming';
        html = ['incoming', 'outgoing', 'archive'].indexOf(seg) !== -1 ? BN.pageInvoices(seg, r) : BN.pageInvoice(seg, r);

      html = '<div class="banner error"><div><strong>The prototype hit an error rendering this screen.</strong> ' + esc(e.message) + '</div></div>';

  function afterRender(r) {
    const dl = $('#addr');

    if (BN.S.focus) {
      const el = document.querySelector(BN.S.focus.sel);
      if (el) { el.focus(); if (BN.S.focus.pos != null && el.setSelectionRange) { try { el.setSelectionRange(BN.S.focus.pos, BN.S.focus.pos); } catch (e) { /* ignore */ } } }

    if (r.parts[0] === 'trips' && r.parts[1] && ['active', 'closed', 'all'].indexOf(r.parts[1]) === -1) {
      const t = BN.tripById(r.parts[1]), cid = myCid();

  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A' && !el.dataset.href && el.dataset.act !== 'notif-open') return;
    e.preventDefault();
    fn(el, e);
  }
  function bindValue(el) {
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'radio') { if (!el.checked) return; v = el.value; }
    else v = el.value;
    BN.setPath(BN.S.form.data, el.dataset.bind, v);
  }
  function onInput(e) {
    const el = e.target;
    if (el.dataset.bind && BN.S.form) { bindValue(el); return; }
    if (el.dataset.filter === 'q') {
      clearTimeout(BN.S.searchTimer);
      const value = el.value, pos = el.selectionStart;
      BN.S.searchTimer = setTimeout(() => { BN.S.focus = { sel: '[data-filter="q"]', pos: pos }; setQuery({ q: value, page: null }); }, 300);
    }
  }
  function onChange(e) {
    const el = e.target;
    if (el.dataset.bind && BN.S.form) {
      bindValue(el);
      if (el.dataset.rerender) {
        BN.S.focus = { sel: '[data-bind="' + el.dataset.bind + '"]' + (el.type === 'radio' ? '[value="' + el.value + '"]' : '') };
        render();
      }
      return;
    }
    if (el.dataset.change === 'persona') {
      BN.S.userId = el.value; BN.S.form = null; BN.S.notifOpen = false;
      toast('Signed in as ' + me().name + ' — ' + ROLE_LABEL[me().role] + ', ' + cname(myCid()) + '.');
      const r = parseHash();
      if (r.parts[0] === 'request' && !can('createRequest')) { go('#/dashboard'); return; }
      render(); return;
    }
    if (el.dataset.change === 'prefill') { if (el.value) BN.prefill(el.value); else BN.S.form = BN.newForm(); render(); return; }
    if (el.dataset.change === 'thread') { BN.S.threadSel[el.dataset.id] = el.value; render(); return; }
    if (el.id === 'attach') { BN.addAttachments(el.files); render(); return; }
    if (el.dataset.invline) {
      const r = parseHash();
      const inv = BN.invoiceVersions(r.parts[1]).find((x) => String(x.version) === (r.q.get('v') || String(BN.invoiceVersions(r.parts[1]).slice(-1)[0].version)));
      const bits = el.dataset.invline.split('.'), line = inv.lines[+bits[0]], key = bits[1];
      if (key === 'desc') line.desc = el.value;
      if (key === 'qty') line.qty = +el.value || 0;
      if (key === 'unit') { const m = parseMoney(el.value); line.unit = isNaN(m) ? line.unit : m; }
      if (key === 'vat') line.vat = +el.value || 0;
      BN.S.focus = { sel: '[data-invline="' + el.dataset.invline + '"]' };
      render(); return;
    }
    if (el.dataset.filter === 'status') {
      const r = parseHash();
      const set = new Set((r.q.get('status') || '').split(',').filter(Boolean));
      if (el.checked) set.add(el.dataset.value); else set.delete(el.dataset.value);
      BN.S.focus = { sel: '[data-filter="status"][data-value="' + el.dataset.value + '"]' };
      setQuery({ status: Array.from(set).join(','), page: null }); return;
    }
    if (el.dataset.filter === 'size') { setQuery({ size: el.value, page: null }); return; }
    if (el.dataset.filter && el.dataset.filter !== 'q') {
      BN.S.focus = { sel: '[data-filter="' + el.dataset.filter + '"]' };
      setQuery({ [el.dataset.filter]: el.value, page: null });
    }
  }
  /* <details> menus stay open until their own summary is clicked; close them
     on any click outside, like a native <select>. Runs in the capture phase so
     it sees the target before an action re-renders the page. */
  function closeMenus(except) {
    document.querySelectorAll('details[data-keep][open]').forEach((d) => {
      if (d === except) return;
      d.open = false; BN.S.openDetails[d.dataset.keep] = false;
    });
  }
  function onOutsideClick(e) {
    const own = e.target.closest && e.target.closest('details[data-keep]');
    closeMenus(own);
  }
  function onKey(e) {
    if (e.key === 'Escape') {
      if (BN.S.modal) { closeModal(); return; }
      const menu = document.querySelector('details[data-keep][open]');
      if (menu) { closeMenus(null); menu.querySelector('summary').focus(); return; }
      if (BN.S.notifOpen) { BN.S.notifOpen = false; render(); return; }
    }
    if (e.key === 'Enter' && e.target.matches('tr.row')) { e.preventDefault(); go(e.target.dataset.href); }
    if (e.key === 'Tab' && BN.S.modal) {
      const nodes = $('#modal-root').querySelectorAll('button, input, textarea, select, a[href]');
      if (!nodes.length) return;
      const first = nodes[0], last = nodes[nodes.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  /* ---------------- boot ---------------- */
  function boot() {
    BN.initState(null);
    const restored = BN.loadState();
    if (restored) BN.scheduler(true);
    if (BN.S.theme) document.documentElement.setAttribute('data-theme', BN.S.theme);
    document.addEventListener('click', onOutsideClick, true);
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onKey);
    document.addEventListener('toggle', (e) => {
      if (e.target.dataset && e.target.dataset.keep) BN.S.openDetails[e.target.dataset.keep] = e.target.open;
    }, true);
    window.addEventListener('hashchange', () => {
