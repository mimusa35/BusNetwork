/* BusNetwork portal prototype — tokens from DESIGN.md (light + dark) */

:root {
  --ground: #F2F5F6; --paper: #FFFFFF; --ink: #132029; --ink-2: #45545E; --ink-3: #6B7A83;
  --rule: #D3DCE0; --rule-soft: #E6EBED;
  --accent: #0B6B5A; --accent-soft: #DDEFEA; --on-accent: #FFFFFF;
  --amber: #8F5500; --amber-soft: #FBEFD8;
  --red: #A13A2C; --red-soft: #F6E2DE;
  --blue: #1E5886; --blue-soft: #E1ECF5;
  --grey: #55636B; --grey-soft: #E8EDEF;
  --bar: #132029; --bar-ink: #E1E8EB; --bar-ink-2: #A7B4BB;
  --shadow-overlay: 0 8px 24px rgba(19, 32, 41, .18);
  --shadow-modal: 0 16px 48px rgba(19, 32, 41, .24);
  --display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0D1418; --paper: #131C21; --ink: #E1E8EB; --ink-2: #A7B4BB; --ink-3: #7C8A92;
    --rule: #27333A; --rule-soft: #1C262C;
    --accent: #55C4A8; --accent-soft: #143530; --on-accent: #0D1418;
    --amber: #E4A74C; --amber-soft: #382A13;
    --red: #E68B7C; --red-soft: #3A1F1B;
    --blue: #80B5E2; --blue-soft: #172A3A;
    --grey: #A2AFB6; --grey-soft: #1F2A30;
    --bar: #081013; --bar-ink: #E1E8EB; --bar-ink-2: #A7B4BB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0D1418; --paper: #131C21; --ink: #E1E8EB; --ink-2: #A7B4BB; --ink-3: #7C8A92;
  --rule: #27333A; --rule-soft: #1C262C;
  --accent: #55C4A8; --accent-soft: #143530; --on-accent: #0D1418;
  --amber: #E4A74C; --amber-soft: #382A13;
  --red: #E68B7C; --red-soft: #3A1F1B;
  --blue: #80B5E2; --blue-soft: #172A3A;
  --grey: #A2AFB6; --grey-soft: #1F2A30;
  --bar: #081013; --bar-ink: #E1E8EB; --bar-ink-2: #A7B4BB;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 14px/1.5 var(--body); min-height: 100vh; display: flex; flex-direction: column; }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: .93em; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.skip { position: absolute; left: -9999px; top: 8px; z-index: 200; background: var(--paper); border: 2px solid var(--accent); padding: 8px 12px; }
.skip:focus { left: 16px; }

/* ---------- Top bar (S-00) ---------- */
.topbar { background: var(--bar); color: var(--bar-ink); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 24px; }
.tb-left { display: flex; align-items: center; gap: 14px; }
.logo-link { display: inline-flex; align-items: center; border-radius: 4px; }
.logo-link:focus-visible { outline: 2px solid #55C4A8; outline-offset: 3px; }
.logo { width: 40px; height: 32px; display: block; }
.tb-company { color: var(--bar-ink-2); }
.tb-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tb-field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--bar-ink-2); }
.tb-field select { background: transparent; color: var(--bar-ink); border: 1px solid #3B4A53; border-radius: 3px; padding: 4px 6px; max-width: 280px; }
.tb-field select option, .tb-field select optgroup { color: #132029; background: #fff; }
.icon-btn { background: transparent; border: 1px solid #3B4A53; color: var(--bar-ink); border-radius: 3px; height: 30px; min-width: 32px; display: inline-grid; place-items: center; cursor: pointer; position: relative; }
.icon-btn b { position: absolute; top: -6px; right: -6px; background: #E4A74C; color: #132029; font: 600 10px/16px var(--body); min-width: 16px; padding: 0 4px; border-radius: 8px; }
.icon-btn svg { width: 16px; height: 16px; }
.demo { position: relative; }
.demo summary { list-style: none; cursor: pointer; border: 1px dashed #5B6B74; border-radius: 3px; padding: 4px 8px; font-size: 12px; color: var(--bar-ink-2); }
.demo summary::-webkit-details-marker { display: none; }
.demo .menu { position: absolute; right: 0; top: 34px; z-index: 60; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); box-shadow: var(--shadow-overlay); border-radius: 6px; padding: 6px; display: grid; min-width: 220px; }
.demo .menu button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 4px; cursor: pointer; }
.demo .menu button:hover { background: var(--ground); }
.demo .menu p { margin: 4px 10px 8px; font-size: 12px; color: var(--ink-3); }

/* ---------- Navigation bar ---------- */
.navbar { background: var(--paper); border-bottom: 1px solid var(--rule); display: flex; align-items: stretch; padding: 0 24px; overflow-x: auto; }
.brand { font-family: var(--display); font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 10px; padding-right: 20px; margin-right: 8px; border-right: 1px solid var(--rule); white-space: nowrap; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 14px 0 0 -2px var(--accent-soft); margin-right: 10px; }
.navbar ul { list-style: none; display: flex; margin: 0; padding: 0; }
.tab { display: flex; align-items: center; gap: 6px; padding: 14px 16px 11px; color: var(--ink-2); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; font-size: 13.5px; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.badge { font: 500 10.5px/1 var(--mono); background: var(--grey-soft); color: var(--ink-2); padding: 3px 6px; border-radius: 9px; }
.badge.warn { background: var(--amber-soft); color: var(--amber); }

/* ---------- Page ---------- */
.page { flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; padding-inline: 24px; padding-block: 20px 48px; outline: none; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-title { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.1; margin: 0; }
.page-title .count { font-family: var(--mono); font-size: 14px; color: var(--ink-3); font-weight: 400; margin-left: 8px; }
.section { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0 0 10px; }
.label { font: 500 10.5px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; }
.stack > * + * { margin-top: 16px; }
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 1023px) { .grid-2 { grid-template-columns: 1fr; } .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .page { padding-inline: 16px; } .topbar, .navbar { padding-inline: 16px; } }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 3px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; text-decoration: none; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-danger { color: var(--red); border-color: var(--red); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn-link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; white-space: nowrap; }
.st-requested, .inv-pending { background: var(--amber-soft); color: var(--amber); }
.st-accepted, .inv-approved { background: var(--accent-soft); color: var(--accent); }
.st-in_progress { background: var(--blue-soft); color: var(--blue); }
.st-completed, .inv-draft { background: var(--grey-soft); color: var(--grey); }
.st-cancelled, .st-rejected, .inv-declined { background: var(--red-soft); color: var(--red); }
.reason { display: block; font-size: 12px; color: var(--ink-2); margin-top: 3px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flag24 { display: block; margin-top: 4px; font-size: 12px; color: var(--amber); font-weight: 600; }
.tag { font: 500 10.5px/1 var(--mono); padding: 4px 6px; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-2); }
.chip-plus { font: 500 10.5px/1 var(--mono); padding: 2px 5px; border-radius: 8px; background: var(--grey-soft); color: var(--ink-2); margin-left: 4px; cursor: help; }
.unread-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 4px; }

/* ---------- KPI tiles (S-01) ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 1279px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { display: block; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; color: inherit; text-decoration: none; }
.kpi:hover { border-color: var(--accent); }
.kpi .v { font: 700 32px/1.05 var(--display); font-variant-numeric: tabular-nums; margin: 4px 0 2px; display: block; }
.kpi .v.money { font-size: 24px; }
.kpi .d { font-size: 12.5px; color: var(--ink-2); }
.dash-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; background: var(--paper); }
.seg button, .seg label { border: 0; background: none; padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.seg button + button, .seg label + label { border-left: 1px solid var(--rule); }
.seg .on, .seg label:has(input:checked) { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.action-group { margin: 0 0 12px; }
.action-group h3 { display: flex; justify-content: space-between; font-size: 13px; margin: 0 0 6px; }
.action-group ul { list-style: none; margin: 0; padding: 0; }
.action-group li { border-top: 1px solid var(--rule-soft); }
.action-group li a { display: block; padding: 7px 0; text-decoration: none; color: var(--ink); }
.action-group li a:hover { color: var(--accent); }
.action-group li small { display: block; color: var(--ink-2); }
.chart svg { width: 100%; height: auto; display: block; }
.chart .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.chart .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; }
.bars li { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 6px 0; border-top: 1px solid var(--rule-soft); }
.bars .bar { grid-column: 1 / -1; height: 6px; background: var(--grey-soft); border-radius: 3px; overflow: hidden; }
.bars .bar span { display: block; height: 100%; background: var(--accent); }

/* ---------- Toolbar, chips, table (S-11) ---------- */
/* List toolbar: row 1 = search + filters + Export; row 2 = date ranges and quick filters.
   Every control is 36px tall so labels and boxes line up. */
.toolbar { display: grid; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.tb-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.tb-row-2:empty { display: none; }
.tf { display: grid; gap: 5px; min-width: 0; }
.tf > span, .tf > legend { font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 0; }
.tf input, .tf select { height: 36px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); padding: 0 10px; }
.tf select { min-width: 150px; }
.tf-grow { flex: 1 1 220px; }
.tf-grow input[type="search"] { width: 100%; }
fieldset.tf { border: 0; margin: 0; padding: 0; }
.range-box { display: inline-flex; align-items: center; height: 36px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); }
.range-box input { border: 0; height: 34px; background: transparent; }
.range-sep { color: var(--ink-3); padding: 0 2px; }
.range-box:focus-within { border-color: var(--accent); }
.tb-export { margin-left: auto; }
.tb-row .dropdown summary { height: 36px; border-radius: 4px; min-width: 120px; justify-content: space-between; }
.tb-row .tb-export summary { min-width: 0; font-weight: 500; }
.dropdown.dropdown-end .panel { left: auto; right: 0; }
.dropdown .panel.menu-list { display: grid; gap: 2px; padding: 6px; min-width: 160px; }
.menu-list button { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 4px; cursor: pointer; color: var(--ink); }
.menu-list button:hover, .menu-list button:focus-visible { background: var(--accent-soft); }
.menu-list small { color: var(--ink-3); font-family: var(--mono); }
.tb-row-2 .chip.quick { height: 36px; padding: 0 14px; }
.dropdown { position: relative; }
.dropdown summary { list-style: none; height: 32px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; background: var(--paper); white-space: nowrap; }
.dropdown summary::-webkit-details-marker { display: none; }
.dropdown .panel { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--shadow-overlay); border-radius: 6px; padding: 10px 12px; min-width: 220px; display: grid; gap: 4px; }
.dropdown .panel .grp { font-weight: 600; margin-top: 4px; }
.dropdown .panel .ind { padding-left: 20px; }
.check, .radio { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12.5px; }
.chip button { border: 0; background: none; color: inherit; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; }
.chip.quick { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); padding-right: 10px; cursor: pointer; }
.chip.quick.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--rule-soft); }
th { font: 500 10.5px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); background: var(--ground); white-space: nowrap; }
th .sort { background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; }
th .sort.on { color: var(--ink); }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover, tbody tr.row:focus-within { background: var(--ground); }
tbody tr.row:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
td.id a, td.id { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
tfoot td { font-weight: 600; background: var(--ground); }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; font-size: 13px; }
.pager .pages { display: flex; align-items: center; gap: 8px; }
.pager select { height: 28px; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); }
.empty { text-align: center; padding: 40px 16px; color: var(--ink-2); }
.empty p { margin: 0 0 12px; font-size: 15px; }
.count-line { font-size: 12.5px; color: var(--ink-2); padding: 8px 12px; border-bottom: 1px solid var(--rule); }
.subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); padding: 0 12px; }
.subtabs a { padding: 10px 14px 8px; text-decoration: none; color: var(--ink-2); border-bottom: 3px solid transparent; }
.subtabs a.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

/* ---------- Banners, toasts ---------- */
.banner { border: 1px solid var(--rule); border-left: 3px solid var(--blue); background: var(--blue-soft); padding: 10px 14px; border-radius: 4px; margin-bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.banner.warn { border-left-color: var(--amber); background: var(--amber-soft); }
.banner.error { border-left-color: var(--red); background: var(--red-soft); }
.banner.ok { border-left-color: var(--accent); background: var(--accent-soft); }
.banner-actions { display: inline-flex; gap: 6px; }
.toasts { position: fixed; left: 16px; bottom: 16px; z-index: 300; display: grid; gap: 8px; max-width: min(460px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--ground); padding: 10px 14px; border-radius: 4px; box-shadow: var(--shadow-overlay); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.toast a { color: var(--accent-soft); font-weight: 600; }

/* ---------- Forms (S-02, S-08) ---------- */
.form-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1023px) { .form-layout { grid-template-columns: 1fr; } }
.stepper { list-style: none; margin: 0; padding: 0 0 0 20px; position: relative; }
.stepper::before { content: ""; position: absolute; left: 6px; top: 12px; bottom: 12px; width: 2px; background: var(--rule); }
.stepper li { position: relative; padding: 6px 0; }
.stepper li::before { content: ""; position: absolute; left: -20px; top: 12px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink-3); background: var(--ground); }
.stepper li.done::before { background: var(--accent); border-color: var(--accent); }
.stepper li.cur::before { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.stepper button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--ink-2); }
.stepper li.cur button { color: var(--ink); font-weight: 600; }
.stepper button[disabled] { cursor: default; color: var(--ink-3); }
.stepper small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.field { display: grid; gap: 4px; align-content: start; min-width: 0; }
.field.wide { grid-column: 1 / -1; }

window.BN = (function () {

  const ROLE_LABEL = { SALES: 'Sales / Dispatcher', PCOORD: 'Partner Coordinator', FIN: 'Finance User', ADMIN: 'Company Admin', VIEWER: 'Viewer / Management' };
  const AGREEMENT_LABEL = { PERCENTAGE: 'Percentage', FULL_DAY: 'Full day', HALF_DAY: 'Half day', NONE: 'None' };
  const ATTACH_TYPES = ['pdf', 'jpg', 'jpeg', 'png', 'docx'];

  /* ---- Permissions (PRD §7.10) ---- */
  const PERMS = {
    createRequest: ['SALES', 'ADMIN'],
    respond: ['PCOORD', 'ADMIN'],
    cancel: ['SALES', 'PCOORD', 'ADMIN'],
    comment: ['SALES', 'PCOORD', 'FIN', 'ADMIN'],
    markComplete: ['PCOORD', 'ADMIN'],
    altStart: ['PCOORD', 'ADMIN'],
    proposePrice: ['SALES', 'ADMIN'],
    confirmPrice: ['PCOORD', 'ADMIN'],
    invoiceIssue: ['FIN', 'ADMIN'],
    invoiceDecide: ['FIN', 'ADMIN'],
    exportLists: ['SALES', 'PCOORD', 'FIN', 'ADMIN', 'VIEWER'],
  };

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const BN = {};

  BN.initState = function (keep) {
    BN.S = {
      now: Date.parse(D.NOW),
      userId: keep ? keep.userId : 'U1',
      locale: 'nb-NO', // fixed: the prototype has no language switch
      theme: keep ? keep.theme : null,
      trips: clone(D.trips),
      invoices: clone(D.invoices),
      customers: clone(D.customers),
      notifications: clone(D.notifications),
      drafts: [], seen: {}, scroll: {}, lastList: {}, lastListKind: 'active',
      threadSel: {}, histFilter: {}, openDetails: {},
      form: null, formKey: null, modal: null, modalTrigger: null,
      notifOpen: false, dashUpdated: 0, focus: null, prevHash: '', navigated: true, searchTimer: null,
      seq: { trip: 48400, inv: D.invoiceSeq, n: 1000, draft: 0 },

      loaded: {}, loading: null, guideSeen: false, guideFlow: null,

  };

  /* ---- small utils ---- */
  const esc = (v) => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const trunc = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + '…' : String(s));
  function setPath(obj, path, value) {
    const parts = path.split('.');
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
    cur[parts[parts.length - 1]] = value;
  }
  function getPath(obj, path) { return path.split('.').reduce((o, k) => (o === undefined || o === null ? o : o[k]), obj); }

  /* ---- time (BR-07, BN-LST-03, BN-LST-07) ---- */
  function zoneParts(ms) {
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(ms));

  }
  function fmtDT(v) { if (v === null || v === undefined || v === '') return '—'; const ms = typeof v === 'number' ? v : Date.parse(v); if (isNaN(ms)) return '—'; const o = zoneParts(ms); return o.year + '-' + o.month + '-' + o.day + ' ' + o.hour + ':' + o.minute; }
  function fmtD(v) { const s = fmtDT(v); return s === '—' ? s : s.slice(0, 10); }
  function tzOffset(ms) { const o = zoneParts(ms); return Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour, +o.minute) - Math.floor(ms / MIN) * MIN; }
  function zonedToUtc(y, mo, d, h, mi) {

  }
  function dayStartUtc(ymd) { const p = ymd.split('-').map(Number); return zonedToUtc(p[0], p[1], p[2], 0, 0); }
  function dayEndUtc(ymd) { const p = ymd.split('-').map(Number); return zonedToUtc(p[0], p[1], p[2], 23, 59) + 59999; }
  function localToIso(v) { if (!v) return null; const parts = v.split('T'); const d = parts[0].split('-').map(Number); const t = (parts[1] || '00:00').split(':').map(Number); return new Date(zonedToUtc(d[0], d[1], d[2], t[0], t[1])).toISOString(); }
  function isoToLocal(iso) { if (!iso) return ''; return fmtDT(iso).replace(' ', 'T'); }
  function todayYmd() { return fmtD(BN.S.now); }
  function addDaysYmd(ymd, n) { return fmtD(dayStartUtc(ymd) + n * DAY + 12 * HOUR); }
  function isoDow(ymd) { const p = ymd.split('-').map(Number); const w = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); return w === 0 ? 7 : w; }
  function isoWeek(ymd) {

  const nowIso = () => new Date(BN.S.now).toISOString();

  /* ---- money (BR-08) ---- */
  const roundHalfAway = (x) => (x < 0 ? -Math.round(-x) : Math.round(x));
  function num(minor) { return new Intl.NumberFormat(BN.S.locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(minor / 100); }
  function money(minor, cur) { if (minor === null || minor === undefined || isNaN(minor)) return '—'; return num(minor) + ' ' + (cur || 'NOK'); }
  function parseMoney(str) {
    if (str === null || str === undefined) return NaN;
    const s = String(str).replace(/[\s ]/g, '').replace(',', '.');
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
    const parts = s.split('.');
    return (+parts[0]) * 100 + (parts[1] ? +parts[1].padEnd(2, '0') : 0);
  }
  const moneyInput = (minor) => (minor === null || minor === undefined || isNaN(minor) ? '' : (minor / 100).toFixed(2));

  /* ---- domain ---- */
  const me = () => D.users.find((u) => u.id === BN.S.userId);
  const myCid = () => me().companyId;
  const company = (id) => D.companies.find((c) => c.id === id) || { id: id, name: id, vat: 25, currency: 'NOK' };
  const cname = (id) => company(id).name;
  const can = (p) => PERMS[p].indexOf(me().role) !== -1;
  const tripById = (id) => BN.S.trips.find((t) => t.id === String(id));
  const reqOf = (t, cid) => t.requests.find((r) => r.partnerId === cid);
  const customerOf = (t) => BN.S.customers.find((c) => c.id === t.customerId) || { name: '—', contact: '—', phone: '—' };
  const affiliation = (hostId, partnerId) => D.affiliations.find((a) => a.hostId === hostId && a.partnerId === partnerId);
  const vehicleName = (id) => { const v = D.vehicleTypes.find((x) => x.id === id); return v ? v.name : (id || '—'); };

  function sideOf(t, cid) { if (t.hostId === cid) return 'SHARED'; return reqOf(t, cid) ? 'RECEIVED' : null; }
  function viewOf(t, cid) {                      // PRD §6.2 company-view status
    if (t.hostId === cid) return { status: t.status, reason: t.closedReason, closedAt: t.closedAt };
    const r = reqOf(t, cid);
    if (r.state === 'PENDING') return { status: 'REQUESTED', reason: null, closedAt: null };
    if (r.state === 'ACCEPTED') return { status: t.status, reason: t.closedReason, closedAt: t.closedAt };
    if (r.state === 'REJECTED') return { status: 'REJECTED', reason: r.reason, closedAt: r.closedAt };
    if (r.state === 'EXPIRED') return { status: 'REJECTED', reason: 'Expired', closedAt: r.closedAt };
    return { status: 'CANCELLED', reason: r.withdrawReason, closedAt: r.closedAt };
  }
  function counterparts(t, cid) { if (t.hostId !== cid) return [t.hostId]; if (t.acceptedPartnerId) return [t.acceptedPartnerId]; return t.requests.map((r) => r.partnerId); }
  function vm(t) { const cid = myCid(); const v = viewOf(t, cid); return { t: t, side: sideOf(t, cid), status: v.status, reason: v.reason, closedAt: v.closedAt, cps: counterparts(t, cid) }; }
  function visibleTrips() { const cid = myCid(); return BN.S.trips.filter((t) => sideOf(t, cid)); }
  const startAddr = (t) => (t.altStart ? t.altStart.address : t.from.address);
  const routeText = (t) => startAddr(t) + ' → ' + t.to.address;

  function calcOffer(agreement, customerMinor) {
    if (!agreement) return 0;
    if (agreement.type === 'PERCENTAGE') return isNaN(customerMinor) ? null : roundHalfAway(customerMinor * agreement.rate / 100);
    if (agreement.type === 'FULL_DAY' || agreement.type === 'HALF_DAY') return agreement.rate;
    return 0;
  }
  function priceFor(v) {
    const t = v.t;
    if (v.side === 'RECEIVED') { const r = reqOf(t, myCid()); return { minor: r.offer, text: money(r.offer, t.currency) }; }
    const acc = t.requests.find((r) => r.state === 'ACCEPTED');
    if (acc) return { minor: acc.offer, text: money(acc.offer, t.currency) };
    const live = t.requests.filter((r) => r.state === 'PENDING');
    const list = live.length ? live : t.requests;
    if (list.length === 1) return { minor: list[0].offer, text: money(list[0].offer, t.currency) };
    return { minor: Math.min.apply(null, list.map((r) => r.offer)), text: list.length + ' prices', title: list.map((r) => cname(r.partnerId) + ': ' + money(r.offer, t.currency)).join('\n') };
  }

  /* ---- actions available (PRD §7.4) ---- */
  function allowedActions(v) {
    const a = [], st = v.status, t = v.t;
    if (st === 'REQUESTED' && v.side === 'RECEIVED' && can('respond')) { a.push('accept', 'reject'); }
    if (st === 'REQUESTED' && v.side === 'SHARED') { if (can('createRequest')) a.push('edit'); if (can('cancel')) a.push('cancel'); }
    if (st === 'ACCEPTED') { if (can('cancel')) a.push('cancel'); if (can('comment')) a.push('comment'); }
    if (st === 'IN_PROGRESS') { if (v.side === 'RECEIVED' && can('markComplete')) a.push('complete'); if (can('comment')) a.push('comment'); }

  }

  /* ---- invoices ---- */
  function invoiceVersions(no) { return BN.S.invoices.filter((i) => i.no === no).sort((a, b) => a.version - b.version); }
  function latestInvoices() { const m = {}; BN.S.invoices.forEach((i) => { if (!m[i.no] || m[i.no].version < i.version) m[i.no] = i; }); return Object.keys(m).map((k) => m[k]); }

  /* ---- transitions (PRD §6.3) ---- */

      notify(t.hostId, ['SALES'], 'N-02', 'Trip ' + t.id + ' was rejected by all partners.', '#/trips/' + t.id, ['In-app', 'Email']);
    } else {
      notify(t.hostId, ['SALES'], 'N-02', cname(cid) + ' rejected trip ' + t.id + ': ' + reason, '#/trips/' + t.id, ['In-app', 'Email']);
    }
    return null;
  }
  function cancelTrip(t, reason) {                      // T4
    const cid = myCid();
    if (ACTIVE_SET.indexOf(t.status) === -1) return 'Closed trips can’t be changed.';
    if (t.status === 'IN_PROGRESS') return 'In progress trips can’t be cancelled.';
    const before = t.status;
    t.status = 'CANCELLED'; t.statusChangedAt = nowIso(); t.closedAt = nowIso(); t.closedReason = reason; t.cancelledBy = cid;
    t.requests.forEach((r) => { if (r.state === 'PENDING') { r.state = 'WITHDRAWN'; r.withdrawReason = reason; r.closedAt = nowIso(); } });
    hist(t, 'status', 'Trip cancelled', STATUS_LABEL[before] + ' → Cancelled — ' + reason);
    const soon = Date.parse(t.plannedStart) - BN.S.now < DAY;
    const channels = soon ? ['In-app', 'Email', 'SMS'] : ['In-app', 'Email'];
    const text = 'Trip ' + t.id + ' (' + fmtDT(t.plannedStart) + ') was cancelled by ' + cname(cid) + ': ' + reason;
    if (cid === t.hostId) t.requests.forEach((r) => notify(r.partnerId, null, 'N-04', text, '#/trips/' + t.id, channels));
    else notify(t.hostId, null, 'N-04', text, '#/trips/' + t.id, channels);
    return null;
  }
  function completeTrip(t) {                            // T7
    if (t.status !== 'IN_PROGRESS') return 'Only trips that are in progress can be marked complete.';
    t.status = 'COMPLETED'; t.statusChangedAt = nowIso(); t.closedAt = nowIso();
    hist(t, 'status', 'Marked complete', 'In progress → Completed');
    notify(t.hostId === myCid() ? t.acceptedPartnerId : t.hostId, null, 'N-02', 'Trip ' + t.id + ' was marked complete.', '#/trips/' + t.id, ['In-app']);
    return null;
  }
  function postComment(t, pid, body) {
    t.thread.push({ partnerId: pid, authorName: me().name, companyId: myCid(), body: body, at: nowIso(), readBy: [BN.S.userId] });
    const to = myCid() === t.hostId ? pid : t.hostId;
    notify(to, null, 'N-06', me().name + ' (' + cname(myCid()) + ') commented on trip ' + t.id + '.', '#/trips/' + t.id, ['In-app']);
    hist(t, 'other', 'Comment posted', '', myCid() === t.hostId ? pid : 'BOTH');
  }
  function proposePrice(t, amount, comment) {           // BR-05
    t.priceProposal = { amount: amount, comment: comment, by: me().name, at: nowIso() };
    postComment(t, t.acceptedPartnerId, 'Price change proposed: ' + money(amount, t.currency) + '. ' + comment);
    hist(t, 'price', 'Price change proposed', money(reqOf(t, t.acceptedPartnerId).offer, t.currency) + ' → ' + money(amount, t.currency));
    notify(t.acceptedPartnerId, ['PCOORD', 'ADMIN'], 'N-06', cname(t.hostId) + ' proposes a new offer price for trip ' + t.id + '.', '#/trips/' + t.id, ['In-app', 'Email']);
  }
  function resolvePrice(t, accepted) {
    const p = t.priceProposal, r = reqOf(t, t.acceptedPartnerId);
    if (!p) return;
    if (accepted) {
      hist(t, 'price', 'Price change confirmed', money(r.offer, t.currency) + ' → ' + money(p.amount, t.currency));
      r.offer = p.amount; r.overridden = true; r.overriddenBy = p.by + ' (agreed with ' + me().name + ')';
      postComment(t, t.acceptedPartnerId, 'Price change to ' + money(p.amount, t.currency) + ' confirmed.');
    } else {
      hist(t, 'price', 'Price change declined', money(p.amount, t.currency) + ' not agreed');
      postComment(t, t.acceptedPartnerId, 'Price change to ' + money(p.amount, t.currency) + ' declined. The agreed price stands.');
    }
    t.priceProposal = null;
  }
  function setAltStart(t, address) {                    // BN-DTL-02
    const before = startAddr(t);
    t.altStart = { address: address };
    hist(t, 'edit', 'Alternative start address set', before + ' → ' + address);
    notify(t.hostId, null, 'N-06', cname(myCid()) + ' set an alternative start address on trip ' + t.id + '.', '#/trips/' + t.id, ['In-app']);
  }

  /* ---- invoice transitions (PRD §7.8) ---- */
  function createInvoice(t) {
    if (t.status !== 'COMPLETED') return { error: 'Only Completed trips can be invoiced.' };
    const existing = latestInvoiceForTrip(t.id);
    if (existing && existing.status !== 'DECLINED') return { error: 'Trip ' + t.id + ' already has invoice ' + existing.no + ' (' + INV_LABEL[existing.status] + ').' };
    const cid = myCid(), c = company(cid), r = reqOf(t, cid);
    const lines = [{ desc: 'Trip ' + t.id + ', ' + fmtD(t.plannedStart) + ', ' + t.from.address.split(',')[0] + ' → ' + t.to.address.split(',')[0], qty: 1, unit: r.offer, vat: c.vat, source: 'OFFER_PRICE' }];
    (r.costs || []).forEach((k) => lines.push({ desc: k.desc, qty: 1, unit: k.amount, vat: c.vat, source: 'ADDITIONAL_COST' }));
    const inv = {
      no: 'BN-INV-2026-' + String(++BN.S.seq.inv).padStart(6, '0'), version: 1, tripId: t.id, issuerId: cid, recipientId: t.hostId,
      status: 'DRAFT', lines: lines, currency: t.currency, createdAt: nowIso(), submittedAt: null, decidedAt: null, decidedBy: null, declineReason: null, snapshot: null,
    };
    BN.S.invoices.push(inv);
    hist(t, 'other', 'Invoice created', inv.no + ' v1');
    return { invoice: inv };
  }
  function submitInvoice(inv) {
    if (!inv.lines.length) return 'Add at least one line before submitting.';
    for (let i = 0; i < inv.lines.length; i++) {
      const l = inv.lines[i];
      if (!String(l.desc).trim()) return 'Add a description for line ' + (i + 1) + '.';
      if (!(+l.qty > 0)) return 'Quantity on line ' + (i + 1) + ' must be more than 0.';
      if (!(+l.unit >= 0)) return 'Unit price on line ' + (i + 1) + ' can’t be negative.';
    }
    inv.status = 'PENDING'; inv.submittedAt = nowIso();
    const t = tripById(inv.tripId);
    if (t) hist(t, 'other', 'Invoice submitted', inv.no + ' v' + inv.version);
    notify(inv.recipientId, ['FIN'], 'N-07', cname(inv.issuerId) + ' submitted invoice ' + inv.no + ' (' + money(invTotals(inv).total, inv.currency) + ') for trip ' + inv.tripId + '.', '#/invoices/' + inv.no, ['In-app', 'Email']);
    return null;
  }
  function decideInvoice(inv, approve, reason) {
    if (inv.status !== 'PENDING') return 'This invoice is not waiting for a decision.';
    inv.snapshot = clone(inv.lines);                    // AR-10 amounts locked
    inv.status = approve ? 'APPROVED' : 'DECLINED';
    inv.decidedAt = nowIso(); inv.decidedBy = me().name; inv.declineReason = approve ? null : reason;
    const t = tripById(inv.tripId);
    if (t) hist(t, 'other', approve ? 'Invoice approved' : 'Invoice declined', inv.no + ' v' + inv.version + (approve ? '' : ' — ' + reason));
    notify(inv.issuerId, ['FIN'], 'N-08', 'Invoice ' + inv.no + ' was ' + (approve ? 'approved' : 'declined: ' + reason) + '.', '#/invoices/' + inv.no, ['In-app', 'Email']);
    return null;
  }
  function resubmitInvoice(inv) {
    const next = clone(inv);
    next.version = inv.version + 1; next.status = 'DRAFT'; next.createdAt = nowIso();
    next.submittedAt = null; next.decidedAt = null; next.decidedBy = null; next.declineReason = null; next.snapshot = null;
    BN.S.invoices.push(next);
    const t = tripById(inv.tripId);
    if (t) hist(t, 'other', 'Invoice version created', next.no + ' v' + next.version);
    return next;
  }

  /* ---- scheduler (PRD §6.4) ---- */
  BN.scheduler = function (silent) {
    BN.S.trips.forEach((t) => {
      if (t.status === 'REQUESTED') {
        const dl = Date.parse(t.deadline || t.plannedStart);
        if (!t.deadlineWarned && BN.S.now >= dl - 2 * HOUR) {
          t.deadlineWarned = true;
          if (!silent && BN.S.now < dl) notify(t.hostId, ['SALES'], 'N-05', 'Trip ' + t.id + ' has no partner response and expires at ' + fmtDT(dl) + '.', '#/trips/' + t.id, ['In-app', 'Email']);
        }
        if (BN.S.now >= dl) {
          t.requests.forEach((r) => { if (r.state === 'PENDING') { r.state = 'EXPIRED'; r.closedAt = new Date(dl).toISOString(); } });
          t.status = 'REJECTED'; t.statusChangedAt = new Date(dl).toISOString(); t.closedAt = new Date(dl).toISOString(); t.closedReason = 'Expired';
          t.history.unshift({ at: new Date(dl).toISOString(), actor: 'System', companyId: null, kind: 'status', action: 'Response deadline passed', detail: 'Requested → Rejected (Expired)', visibleTo: 'BOTH' });
          if (!silent) notify(t.hostId, ['SALES'], 'N-02', 'Trip ' + t.id + ' was rejected: expired with no response.', '#/trips/' + t.id, ['In-app', 'Email']);
        }
      }
      if (t.status === 'ACCEPTED' && BN.S.now >= Date.parse(t.plannedStart)) {
        t.status = 'IN_PROGRESS'; t.statusChangedAt = t.plannedStart;
        t.history.unshift({ at: t.plannedStart, actor: 'System', companyId: null, kind: 'status', action: 'Planned start reached', detail: 'Accepted → In progress', visibleTo: 'BOTH' });
      }
      if (t.status === 'IN_PROGRESS' && BN.S.now >= Date.parse(t.plannedEnd)) {
        t.status = 'COMPLETED'; t.statusChangedAt = t.plannedEnd; t.closedAt = t.plannedEnd;
        t.history.unshift({ at: t.plannedEnd, actor: 'System', companyId: null, kind: 'status', action: 'Planned end reached', detail: 'In progress → Completed', visibleTo: 'BOTH' });
      }
    });
  };

  /* ---- CSV export (BN-LST-09) ---- */
  function downloadCsv(filename, rows) {
    const csv = rows.map((r) => r.map((cell) => {
      const s = cell === null || cell === undefined ? '' : String(cell);
      return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(';')).join('\r\n');

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  /* ---- demo persistence: localStorage where the browser allows it, memory otherwise ---- */
  const STORE_KEY = 'bn-demo-state-v1';
  BN.storageOk = (function () {
    try { window.localStorage.setItem('__bn', '1'); window.localStorage.removeItem('__bn'); return true; }
    catch (e) { return false; }
  })();
  BN.saveState = function () {
    if (!BN.storageOk || !BN.S) return;
    try {
      const S = BN.S;
      window.localStorage.setItem(STORE_KEY, JSON.stringify({
        v: 1, now: S.now, userId: S.userId, locale: S.locale, theme: S.theme,
        trips: S.trips, invoices: S.invoices, customers: S.customers, notifications: S.notifications,
        drafts: S.drafts, seen: S.seen, seq: S.seq, guideSeen: S.guideSeen,
      }));
    } catch (e) { /* quota or blocked: the demo carries on in memory */ }
  };
  BN.loadState = function () {
    if (!BN.storageOk) return false;
    try {
      const raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (!d || d.v !== 1 || !d.trips || !d.trips.length) return false;
      Object.assign(BN.S, {
        now: d.now, userId: d.userId || 'U1', locale: 'nb-NO', theme: d.theme || null,
        trips: d.trips, invoices: d.invoices, customers: d.customers, notifications: d.notifications,
        drafts: d.drafts || [], seen: d.seen || {}, seq: d.seq, guideSeen: !!d.guideSeen,
      });
      return true;
    } catch (e) { return false; }
  };
  BN.clearState = function () { if (BN.storageOk) { try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } } };

  Object.assign(BN, {
    D: D, TZ: TZ, MIN: MIN, HOUR: HOUR, DAY: DAY,
    ACTIVE_SET: ACTIVE_SET, CLOSED_SET: CLOSED_SET, STATUS_LABEL: STATUS_LABEL, STATUS_ICON: STATUS_ICON,
    INV_LABEL: INV_LABEL, ROLE_LABEL: ROLE_LABEL, AGREEMENT_LABEL: AGREEMENT_LABEL, ATTACH_TYPES: ATTACH_TYPES, PERMS: PERMS,
    clone: clone, esc: esc, trunc: trunc, setPath: setPath, getPath: getPath,
    fmtDT: fmtDT, fmtD: fmtD, dayStartUtc: dayStartUtc, dayEndUtc: dayEndUtc, zonedToUtc: zonedToUtc,
    localToIso: localToIso, isoToLocal: isoToLocal, todayYmd: todayYmd, addDaysYmd: addDaysYmd, isoDow: isoDow, isoWeek: isoWeek,
    fmtLen: fmtLen, nowIso: nowIso, roundHalfAway: roundHalfAway, num: num, money: money, parseMoney: parseMoney, moneyInput: moneyInput,
    me: me, myCid: myCid, company: company, cname: cname, can: can, tripById: tripById, reqOf: reqOf, customerOf: customerOf,
    affiliation: affiliation, vehicleName: vehicleName, sideOf: sideOf, viewOf: viewOf, counterparts: counterparts, vm: vm,
    visibleTrips: visibleTrips, startAddr: startAddr, routeText: routeText, calcOffer: calcOffer, priceFor: priceFor, allowedActions: allowedActions,
    invoiceVersions: invoiceVersions, latestInvoices: latestInvoices, latestInvoiceForTrip: latestInvoiceForTrip, notInvoiced: notInvoiced,
    lineCalc: lineCalc, invTotals: invTotals, hist: hist, notify: notify, myNotifications: myNotifications,
    acceptTrip: acceptTrip, rejectTrip: rejectTrip, cancelTrip: cancelTrip, completeTrip: completeTrip, postComment: postComment,
    proposePrice: proposePrice, resolvePrice: resolvePrice, setAltStart: setAltStart,
    createInvoice: createInvoice, submitInvoice: submitInvoice, decideInvoice: decideInvoice, resubmitInvoice: resubmitInvoice,

  <script>
/* ===== app-ui.js ===== */
/* BusNetwork portal prototype — shared components, Dashboard (S-01), trip lists (S-03..S-05), trip detail (S-06). */
(function (BN) {
  'use strict';
  const { esc, trunc, fmtDT, fmtD, fmtLen, money, num, cname, can, me, myCid, vm, visibleTrips, priceFor,
    STATUS_LABEL, STATUS_ICON, ACTIVE_SET, CLOSED_SET, INV_LABEL, AGREEMENT_LABEL } = BN;

  /* ---------- components ---------- */
  function pill(st, reason) {
    return '<span class="pill st-' + st.toLowerCase() + '"><span aria-hidden="true">' + STATUS_ICON[st] + '</span> ' + STATUS_LABEL[st] + '</span>' +
      (reason ? '<span class="reason" title="' + esc(reason) + '" tabindex="0">' + esc(trunc(reason, 40)) + '</span>' : '');
  }
  function invPill(st) { return '<span class="pill inv-' + st.toLowerCase() + '">' + INV_LABEL[st] + '</span>'; }
  function dlRow(dt, dd) { return '<div><dt>' + dt + '</dt><dd>' + (dd === '' || dd === null || dd === undefined ? '—' : dd) + '</dd></div>'; }
  function th(label, key, sort) {
    if (!key) return '<th scope="col">' + label + '</th>';
    const p = sort.split(':'), on = p[0] === key;
    return '<th scope="col" aria-sort="' + (on ? (p[1] === 'asc' ? 'ascending' : 'descending') : 'none') + '">' +
      '<button class="sort' + (on ? ' on' : '') + '" data-act="sort" data-key="' + key + '">' + label + '<span aria-hidden="true">' + (on ? (p[1] === 'asc' ? ' ▲' : ' ▼') : '') + '</span></button></th>';
  }
  function pager(total, page, size) {
    const pages = Math.max(1, Math.ceil(total / size));
    const from = total ? (page - 1) * size + 1 : 0, to = Math.min(total, page * size);
    return '<div class="pager"><span>' + from + '–' + to + ' of ' + total + '</span>' +
      '<label>Rows per page <select data-filter="size">' + [10, 25, 50, 100].map((n) => '<option' + (n === size ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label>' +
      '<div class="pages"><button class="btn btn-secondary btn-sm" data-act="page" data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>‹ Prev</button>' +
      '<span>Page ' + page + ' of ' + pages + '</span>' +
      '<button class="btn btn-secondary btn-sm" data-act="page" data-page="' + (page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>Next ›</button></div></div>';
  }
  const FILTER_KEYS = ['q', 'from', 'to', 'company', 'direction', 'status', 'closedFrom', 'closedTo', 'invoice', 'invFrom', 'invTo'];
  const FILTER_LABEL = { q: 'Search', from: 'Start from', to: 'Start to', company: 'Company', direction: 'Direction', status: 'Status', closedFrom: 'Closed from', closedTo: 'Closed to', invoice: 'Invoice', invFrom: 'Invoice from', invTo: 'Invoice to' };
  function hasFilters(q) { return FILTER_KEYS.some((k) => q.get(k)); }
  function chips(q) {
    const items = [];
    FILTER_KEYS.forEach((k) => {
      const v = q.get(k); if (!v) return;
      let text = v;
      if (k === 'status') text = v.split(',').map((s) => STATUS_LABEL[s] || INV_LABEL[s] || s).join(', ');
      if (k === 'company') text = cname(v);
      if (k === 'direction') text = v === 'shared' ? 'Shared by us' : 'Received by us';
      if (k === 'invoice') text = 'Completed, not invoiced';
      items.push('<span class="chip">' + FILTER_LABEL[k] + ': ' + esc(text) + '<button data-act="clear-filter" data-key="' + k + '" aria-label="Remove filter ' + FILTER_LABEL[k] + '">×</button></span>');
    });
    if (!items.length) return '';
    return '<div class="chips">' + items.join('') + '<button class="btn-link" data-act="clear-filters">Clear filters</button></div>';
  }
  function emptyState(kind, q) {
    if (hasFilters(q)) {
      const what = kind === 'active' ? 'active trips' : kind === 'closed' ? 'closed trips' : kind === 'all' ? 'trips' : 'invoices';
      return '<div class="empty"><p>No ' + what + ' match these filters.</p><button class="btn btn-secondary" data-act="clear-filters">Clear filters</button></div>';
    }
    if (kind === 'active') return '<div class="empty"><p>No active trips right now.</p>' + (can('createRequest') ? '<a class="btn btn-primary" href="#/request">Create a request</a>' : '') + '</div>';
    if (kind === 'closed') return '<div class="empty"><p>No closed trips yet.</p></div>';
    if (kind === 'all') return '<div class="empty"><p>No trips yet.</p></div>';
    return '<div class="empty"><p>No invoices yet. Invoices are created from Completed trips.</p></div>';
  }
  const ACTION_DEF = {
    accept: ['Accept', 'primary'], reject: ['Reject', 'danger'], edit: ['Edit', 'secondary'], cancel: ['Cancel', 'danger'],
    comment: ['Comment', 'secondary'], complete: ['Mark complete', 'primary'], invoice: ['Create invoice', 'primary'], viewInvoice: ['View invoice', 'secondary'],
  };
  function actionButtons(v) {
    return BN.allowedActions(v).map((a) => '<button class="btn btn-' + ACTION_DEF[a][1] + ' btn-sm" data-act="trip-' + a + '" data-id="' + v.t.id + '">' + ACTION_DEF[a][0] + '<span class="sr-only"> trip ' + v.t.id + '</span></button>').join(' ');
  }
  function companyCell(v) {
    if (!v.cps.length) return '—';
    const first = cname(v.cps[0]);
    return esc(first) + (v.cps.length > 1 ? '<span class="chip-plus" title="' + esc(v.cps.map(cname).join(', ')) + '">+' + (v.cps.length - 1) + '</span>' : '');
  }
  function routeCell(t) {
    const vias = t.vias && t.vias.length ? '<span class="chip-plus" title="' + esc(t.vias.map((x) => x.address).join('\n')) + '">+' + t.vias.length + '</span>' : '';
    return esc(BN.startAddr(t).split(',')[0]) + ' → ' + esc(t.to.address.split(',')[0]) + vias;
  }
  function commentsCell(t) {
    const cid = myCid();
    const items = t.thread.filter((c) => (cid === t.hostId ? true : c.partnerId === cid));
    const unread = items.filter((c) => c.companyId !== cid && c.readBy.indexOf(BN.S.userId) === -1).length;
    if (!items.length) return '<span class="muted">0</span>';
    return (unread ? '<span class="unread-dot" aria-hidden="true"></span><strong>' + items.length + '</strong> <span class="sr-only">(' + unread + ' unread)</span>' : items.length);
  }
  function invoiceCell(v) {
    if (v.status !== 'COMPLETED') return '—';
    const inv = BN.latestInvoiceForTrip(v.t.id);
    if (!inv || (inv.status === 'DRAFT' && inv.issuerId !== myCid())) return '<span class="muted">Not invoiced</span>';
    return '<a href="#/invoices/' + inv.no + '">' + invPill(inv.status) + '</a>';
  }

  /* ---------- trip list query (AR-02: one builder, status set differs) ---------- */
  const LISTS = {
    active: { title: 'Active Trips', set: ACTIVE_SET, defSort: 'start:asc' },
    closed: { title: 'Closed Trips', set: CLOSED_SET, defSort: 'start:desc' },
    all: { title: 'All Trips', set: ACTIVE_SET.concat(CLOSED_SET), defSort: 'start:desc' },
  };
  function queryTrips(kind, q) {
    const cfg = LISTS[kind];
    let rows = visibleTrips().map(vm).filter((v) => cfg.set.indexOf(v.status) !== -1);
    const s = (q.get('q') || '').trim().toLowerCase();
    if (s) {
      rows = rows.filter((v) => [v.t.id, v.t.from.address, v.t.to.address, v.t.groupRef, (v.t.altStart || {}).address]
        .concat(v.cps.map(cname)).some((x) => x && String(x).toLowerCase().indexOf(s) !== -1));
    }
    const from = q.get('from'), to = q.get('to');
    if (from) rows = rows.filter((v) => Date.parse(v.t.plannedStart) >= BN.dayStartUtc(from));
    if (to) rows = rows.filter((v) => Date.parse(v.t.plannedStart) <= BN.dayEndUtc(to));
    const co = q.get('company'); if (co) rows = rows.filter((v) => v.cps.indexOf(co) !== -1);
    const dir = q.get('direction');
    if (dir === 'shared') rows = rows.filter((v) => v.side === 'SHARED');
    if (dir === 'received') rows = rows.filter((v) => v.side === 'RECEIVED');
    const st = (q.get('status') || '').split(',').filter(Boolean);
    if (st.length) rows = rows.filter((v) => st.indexOf(v.status) !== -1);
    const cf = q.get('closedFrom'), ct = q.get('closedTo');
    if (cf) rows = rows.filter((v) => v.closedAt && Date.parse(v.closedAt) >= BN.dayStartUtc(cf));
    if (ct) rows = rows.filter((v) => v.closedAt && Date.parse(v.closedAt) <= BN.dayEndUtc(ct));
    if (q.get('invoice') === 'not_invoiced') rows = rows.filter((v) => v.status === 'COMPLETED' && v.side === 'RECEIVED' && BN.notInvoiced(v.t));
    return sortRows(rows, q.get('sort') || cfg.defSort);
  }
  function sortRows(rows, sort) {
    const p = sort.split(':'), dir = p[1] === 'desc' ? -1 : 1;
    const keys = {
      id: (v) => +v.t.id, start: (v) => Date.parse(v.t.plannedStart),
      length: (v) => Date.parse(v.t.plannedEnd) - Date.parse(v.t.plannedStart),
      pax: (v) => (v.t.pax === null || v.t.pax === undefined ? -1 : v.t.pax),
      price: (v) => { const x = priceFor(v).minor; return x === null || x === undefined ? -1 : x; },
    };
    const k = keys[p[0]] || keys.start;
    return rows.slice().sort((a, b) => (k(a) - k(b)) * dir || (+a.t.id - +b.t.id));
  }
  BN.queryTrips = queryTrips;
  BN.LISTS = LISTS;

  /* ---------- toolbar ---------- */
  function companyOptions(rowsAll, selected) {
    const ids = {};
    rowsAll.forEach((v) => v.cps.forEach((c) => { ids[c] = (v.side === 'SHARED' ? 'Partners' : 'Hosts'); }));
    const groups = { Partners: [], Hosts: [] };
    Object.keys(ids).forEach((id) => groups[ids[id]].push(id));
    const opt = (id) => '<option value="' + id + '"' + (id === selected ? ' selected' : '') + '>' + esc(cname(id)) + '</option>';
    let html = '<option value="">All companies</option>';
    ['Partners', 'Hosts'].forEach((g) => {
      if (groups[g].length) html += '<optgroup label="' + g + '">' + groups[g].sort((a, b) => cname(a).localeCompare(cname(b))).map(opt).join('') + '</optgroup>';
    });
    return html;
  }
  function statusDropdown(kind, q) {
    const sel = (q.get('status') || '').split(',').filter(Boolean);
    const box = (s) => '<label class="check"><input type="checkbox" data-filter="status" data-value="' + s + '"' + (sel.indexOf(s) !== -1 ? ' checked' : '') + '> ' + STATUS_LABEL[s] + '</label>';
    let panel = '';
    if (kind === 'all') {
      panel = '<div class="grp"><label class="check"><input type="checkbox" data-act="status-group" data-group="active"' + (ACTIVE_SET.every((s) => sel.indexOf(s) !== -1) ? ' checked' : '') + '> Active</label></div>' +
        '<div class="ind">' + ACTIVE_SET.map(box).join('') + '</div>' +
        '<div class="grp"><label class="check"><input type="checkbox" data-act="status-group" data-group="closed"' + (CLOSED_SET.every((s) => sel.indexOf(s) !== -1) ? ' checked' : '') + '> Closed</label></div>' +
        '<div class="ind">' + CLOSED_SET.map(box).join('') + '</div>';
    } else {
      panel = LISTS[kind].set.map(box).join('');
    }
    const open = BN.S.openDetails.status ? ' open' : '';
    return '<details class="dropdown" data-keep="status"' + open + '><summary>Status' + (sel.length ? ' (' + sel.length + ')' : '') + ' ▾</summary><div class="panel">' + panel + '</div></details>';
  }
  /* Shared toolbar parts: a labelled from–to date range and an Export menu. */
  function dateRange(label, fromKey, toKey, q) {
    return '<fieldset class="tf range"><legend>' + label + '</legend><div class="range-box">' +
      '<input type="date" data-filter="' + fromKey + '" value="' + esc(q.get(fromKey) || '') + '" aria-label="' + label + ' from">' +
      '<span class="range-sep" aria-hidden="true">–</span>' +
      '<input type="date" data-filter="' + toKey + '" value="' + esc(q.get(toKey) || '') + '" aria-label="' + label + ' to"></div></fieldset>';
  }
  function exportMenu(kind) {
    if (!can('exportLists')) return '';
    const open = BN.S.openDetails.export ? ' open' : '';
    return '<details class="dropdown dropdown-end tb-export" data-keep="export"' + open + '><summary>Export ▾</summary><div class="panel menu-list">' +
      '<button data-act="export" data-kind="' + kind + '" data-fmt="csv">CSV <small>.csv</small></button>' +
      '<button data-act="export" data-kind="' + kind + '" data-fmt="xlsx">Excel <small>.xlsx</small></button></div></details>';
  }
  function toolbar(kind, q, rowsAll) {
    const dir = q.get('direction') || '';
    const dirSelect = '<select data-filter="direction">' +
      [['', 'All directions'], ['shared', 'Shared by us'], ['received', 'Received by us']]
        .map((o) => '<option value="' + o[0] + '"' + (dir === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';
    return '<div class="toolbar">' +
      '<div class="tb-row">' +
      '<label class="tf tf-grow"><span>Search</span><input type="search" data-filter="q" value="' + esc(q.get('q') || '') + '" placeholder="Trip ID, address, company, group ref."></label>' +
      '<label class="tf"><span>Company</span><select data-filter="company">' + companyOptions(rowsAll, q.get('company') || '') + '</select></label>' +
      '<label class="tf"><span>Direction</span>' + dirSelect + '</label>' +
      '<div class="tf"><span>Status</span>' + statusDropdown(kind, q) + '</div>' +
      exportMenu(kind) + '</div>' +
      '<div class="tb-row tb-row-2">' +
      dateRange('Trip start', 'from', 'to', q) +
      (kind !== 'active' ? dateRange('Closed', 'closedFrom', 'closedTo', q) : '') +
      (kind === 'closed' ? '<button class="chip quick' + (q.get('invoice') === 'not_invoiced' ? ' on' : '') + '" data-act="toggle-not-invoiced">Completed, not invoiced</button>' : '') +
      '</div></div>' + chips(q);
  }

  /* ---------- S-03/S-04/S-05 trip list ---------- */
  BN.pageTripList = function (kind, r) {
    const q = r.q, cfg = LISTS[kind];
    const rowsAll = visibleTrips().map(vm);
    const rows = queryTrips(kind, q);
    const size = +(q.get('size') || 25), page = Math.max(1, +(q.get('page') || 1));
    const start = (page - 1) * size;
    const slice = rows.slice(start, start + size);
    const sort = q.get('sort') || cfg.defSort;
    const showClosed = kind !== 'active';
    let countLine = '';
    if (kind === 'all') {
      const a = queryTrips('active', q).length, c = queryTrips('closed', q).length;
      countLine = '<div class="count-line">' + rows.length + ' trips — Active ' + a + ' + Closed ' + c + ' = ' + (a + c) + '</div>';
    }
    const head = '<tr>' + th('Trip ID', 'id', sort) + th('Trip start', 'start', sort) + th('Length', 'length', sort) +
      th('From – To') + th('PAX', 'pax', sort) + th('Shift') + th('Company') + th('Type') + th('Price', 'price', sort) + th('Status') + th('Comments') +
      (showClosed ? th('Closed date') + th('Invoice') : '') + th('Actions') + '</tr>';
    const body = slice.map((v) => {
      const t = v.t, price = priceFor(v);
      const soon = v.status === 'REQUESTED' && Date.parse(t.plannedStart) - BN.S.now < BN.DAY && Date.parse(t.plannedStart) > BN.S.now;
      return '<tr class="row" tabindex="0" data-act="open" data-href="#/trips/' + t.id + '">' +
        '<td class="id">' + t.id + '</td>' +
        '<td class="nowrap">' + fmtDT(t.plannedStart) + '</td>' +
        '<td class="nowrap">' + fmtLen(t.plannedStart, t.plannedEnd) + '</td>' +
        '<td>' + routeCell(t) + '</td>' +
        '<td class="num">' + (t.pax === null || t.pax === undefined ? '—' : t.pax) + '</td>' +
        '<td>' + (t.type === 'FIXED' && t.shifts.length ? esc(t.shifts[0].name) : 'N/A') + '</td>' +
        '<td>' + companyCell(v) + '</td>' +
        '<td>' + t.type + '</td>' +
        '<td class="num"' + (price.title ? ' title="' + esc(price.title) + '"' : '') + '>' + price.text + '</td>' +
        '<td>' + pill(v.status, v.reason) + (soon ? '<span class="flag24">⏱ Starts &lt; 24 h</span>' : '') + '</td>' +
        '<td class="num">' + commentsCell(t) + '</td>' +
        (showClosed ? '<td class="nowrap">' + (v.closedAt ? fmtDT(v.closedAt) : '—') + '</td><td>' + invoiceCell(v) + '</td>' : '') +
        '<td><div class="row-actions">' + actionButtons(v) + '</div></td></tr>';
    }).join('');
    return '<div class="page-head"><h1 class="page-title">' + cfg.title + '<span class="count">' + rows.length + ' trips</span></h1></div>' +
      '<div class="card" style="padding:0">' + toolbar(kind, q, rowsAll) + countLine +
      (rows.length ? '<div class="tbl-wrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' + pager(rows.length, page, size) : emptyState(kind, q)) +
      '</div>';
  };

  /* ---------- S-01 dashboard ---------- */
  function periodRange(q) {
    const p = q.get('period') || 'month', today = BN.todayYmd();
    if (p === 'week') { const from = BN.addDaysYmd(today, -(BN.isoDow(today) - 1)); return { p: p, from: from, to: BN.addDaysYmd(from, 6), label: 'Closed this week' }; }
    if (p === '30d') return { p: p, from: BN.addDaysYmd(today, -29), to: today, label: 'Closed last 30 days' };
    if (p === 'custom') return { p: p, from: q.get('from') || today.slice(0, 8) + '01', to: q.get('to') || today, label: 'Closed in period' };
    return { p: 'month', from: today.slice(0, 8) + '01', to: today, label: 'Closed this month' };
  }
  function kpi(href, label, value, desc, cls) {
    return '<a class="kpi" href="' + href + '"><span class="label">' + label + '</span><span class="v ' + (cls || '') + '">' + value + '</span><span class="d">' + desc + '</span></a>';
  }
  function needsAction(vms) {
    const cid = myCid(), u = me(), groups = [];
    if (can('respond')) {
      const items = vms.filter((v) => v.side === 'RECEIVED' && v.status === 'REQUESTED');
      groups.push({ title: 'Incoming requests', href: '#/trips/active?status=REQUESTED&direction=received', items: items.map((v) => ({ href: '#/trips/' + v.t.id, text: 'Trip ' + v.t.id + ' · ' + BN.routeText(v.t).split(' → ').map((x) => x.split(',')[0]).join(' → '), sub: 'Respond by ' + fmtDT(v.t.deadline || v.t.plannedStart) })) });
    }
    const cancels = vms.filter((v) => v.status === 'CANCELLED' && v.t.cancelledBy && v.t.cancelledBy !== cid && v.closedAt && BN.S.now - Date.parse(v.closedAt) < 7 * BN.DAY && !BN.S.seen[cid + ':' + v.t.id]);
    if (cancels.length) groups.push({ title: 'Cancellations', href: '#/trips/closed?status=CANCELLED', items: cancels.map((v) => ({ href: '#/trips/' + v.t.id, text: 'Trip ' + v.t.id + ' cancelled by ' + cname(v.t.cancelledBy), sub: esc(v.reason || '') })) });
    if (can('invoiceDecide')) {
      const inv = BN.latestInvoices().filter((i) => i.recipientId === cid && i.status === 'PENDING');
      groups.push({ title: 'Invoices to approve', href: '#/invoices/incoming?status=PENDING', items: inv.map((i) => ({ href: '#/invoices/' + i.no, text: i.no + ' · ' + cname(i.issuerId), sub: money(BN.invTotals(i).total, i.currency) + ' · trip ' + i.tripId })) });
    }
    if (can('comment')) {
      const unread = [];
      vms.forEach((v) => {
        const items = v.t.thread.filter((c) => (cid === v.t.hostId ? true : c.partnerId === cid)).filter((c) => c.companyId !== cid && c.readBy.indexOf(u.id) === -1);
        if (items.length) unread.push({ href: '#/trips/' + v.t.id, text: 'Trip ' + v.t.id + ' · ' + items.length + ' unread comment' + (items.length > 1 ? 's' : ''), sub: esc(trunc(items[items.length - 1].body, 60)) });
      });
      groups.push({ title: 'Unread comments', href: '#/trips/all', items: unread });
    }
    return groups.filter((g) => g.items.length);
  }
  function volumeChart(vms) {
    const today = BN.todayYmd(), weeks = [];
    const monday = BN.addDaysYmd(today, -(BN.isoDow(today) - 1));
    for (let i = 11; i >= 0; i--) {
      const ws = BN.addDaysYmd(monday, -7 * i);
      weeks.push({ label: 'W' + BN.isoWeek(ws), from: BN.dayStartUtc(ws), to: BN.dayStartUtc(BN.addDaysYmd(ws, 7)), shared: 0, received: 0 });
    }
    vms.forEach((v) => {
      const at = Date.parse(v.t.submittedAt);
      const w = weeks.find((x) => at >= x.from && at < x.to);
      if (w) { if (v.side === 'SHARED') w.shared++; else w.received++; }
    });
    const max = Math.max(1, ...weeks.map((w) => Math.max(w.shared, w.received)));
    const W = 720, H = 200, BASE = 162, TOP = 140, bw = W / weeks.length;
    const bars = weeks.map((w, i) => {
      const x = i * bw, h1 = (w.shared / max) * TOP, h2 = (w.received / max) * TOP;
      return '<rect x="' + (x + bw * 0.14).toFixed(1) + '" y="' + (BASE - h1).toFixed(1) + '" width="' + (bw * 0.33).toFixed(1) + '" height="' + h1.toFixed(1) + '" rx="2" fill="var(--accent)"></rect>' +
        '<rect x="' + (x + bw * 0.53).toFixed(1) + '" y="' + (BASE - h2).toFixed(1) + '" width="' + (bw * 0.33).toFixed(1) + '" height="' + h2.toFixed(1) + '" rx="2" fill="var(--blue)"></rect>' +
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="182" font-size="12" text-anchor="middle" fill="var(--ink-3)">' + w.label + '</text>';
    }).join('');
    const grid = [0, 0.5, 1].map((f) => '<line x1="0" x2="' + W + '" y1="' + (BASE - f * TOP) + '" y2="' + (BASE - f * TOP) + '" stroke="var(--rule-soft)" stroke-width="1"></line>' +
      '<text x="0" y="' + (BASE - f * TOP - 4) + '" font-size="11" fill="var(--ink-3)">' + Math.round(f * max) + '</text>').join('');
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Trips shared and received per week, last 12 weeks">' + grid + bars + '</svg>' +
      '<div class="legend"><span><i style="background:var(--accent)"></i>Shared by us</span><span><i style="background:var(--blue)"></i>Received by us</span></div>' +
      '<table class="sr-only"><caption>Trips per week</caption><thead><tr><th>Week</th><th>Shared</th><th>Received</th></tr></thead><tbody>' +
      weeks.map((w) => '<tr><td>' + w.label + '</td><td>' + w.shared + '</td><td>' + w.received + '</td></tr>').join('') + '</tbody></table></div>';
  }
  BN.pageDashboard = function (r) {
    const q = r.q, cid = myCid(), per = periodRange(q);
    const vms = visibleTrips().map(vm);
    const awaiting = vms.filter((v) => v.side === 'RECEIVED' && v.status === 'REQUESTED');
    const active = vms.filter((v) => v.status === 'ACCEPTED' || v.status === 'IN_PROGRESS');
    const today = BN.todayYmd(), end7 = BN.dayEndUtc(BN.addDaysYmd(today, 6));
    const next7 = active.filter((v) => { const s = Date.parse(v.t.plannedStart); return s >= BN.dayStartUtc(today) && s <= end7; });
    const closedP = vms.filter((v) => v.status === 'COMPLETED' && v.closedAt && Date.parse(v.closedAt) >= BN.dayStartUtc(per.from) && Date.parse(v.closedAt) <= BN.dayEndUtc(per.to));
    const inv = BN.latestInvoices();
    const inPend = inv.filter((i) => i.recipientId === cid && i.status === 'PENDING');
    const outPend = inv.filter((i) => i.issuerId === cid && i.status === 'PENDING');
    const sum = (list) => list.reduce((a, i) => a + BN.invTotals(i).total, 0);
    const upcoming = active.slice().sort((a, b) => Date.parse(a.t.plannedStart) - Date.parse(b.t.plannedStart)).slice(0, 10);
    const groups = needsAction(vms);
    const periods = [['week', 'This week'], ['month', 'This month'], ['30d', 'Last 30 days']];
    const canInv = can('invoiceDecide') || can('invoiceIssue');

    const tiles = kpi('#/trips/active?status=REQUESTED&direction=received', 'Awaiting response', awaiting.length, 'Requests waiting on us') +
      kpi('#/trips/active?status=ACCEPTED,IN_PROGRESS', 'Active trips', active.length, 'Accepted + in progress') +
      kpi('#/trips/active?status=ACCEPTED,IN_PROGRESS&from=' + today + '&to=' + BN.addDaysYmd(today, 6), 'Starting next 7 days', next7.length, 'Trip count') +
      kpi('#/trips/closed?status=COMPLETED&closedFrom=' + per.from + '&closedTo=' + per.to, per.label, closedP.length, 'Completed trips') +
      (canInv ? kpi('#/invoices/incoming?status=PENDING', 'Open invoices', num(sum(inPend)), inPend.length + ' to approve · ' + num(sum(outPend)) + ' awaiting partner', 'money') : '');

    const actionHtml = me().role === 'VIEWER'
      ? '<h2 class="section">Recent activity</h2><ul class="resp">' + vms.slice().sort((a, b) => Date.parse(b.t.statusChangedAt || b.t.submittedAt) - Date.parse(a.t.statusChangedAt || a.t.submittedAt)).slice(0, 8)
        .map((v) => '<li><a href="#/trips/' + v.t.id + '">Trip ' + v.t.id + '</a> · ' + pill(v.status) + '<small class="muted">' + fmtDT(v.t.statusChangedAt || v.t.submittedAt) + '</small></li>').join('') + '</ul>'
      : '<h2 class="section">Needs your action</h2>' + (groups.length ? groups.map((g) => '<div class="action-group"><h3><a href="' + g.href + '">' + g.title + '</a><span class="badge">' + g.items.length + '</span></h3><ul>' +
        g.items.slice(0, 6).map((i) => '<li><a href="' + i.href + '">' + esc(i.text) + '<small>' + i.sub + '</small></a></li>').join('') + '</ul></div>').join('') : '<p class="muted">Nothing waiting on you.</p>');

    const topPartners = (function () {
      const counts = {};
      closedP.forEach((v) => v.cps.forEach((c) => { counts[c] = (counts[c] || 0) + 1; }));
      const list = Object.keys(counts).map((k) => ({ id: k, n: counts[k] })).sort((a, b) => b.n - a.n).slice(0, 5);
      if (!list.length) return '<p class="muted">No completed trips in this period.</p>';
      const max = list[0].n;
      return '<ul class="bars" style="list-style:none;padding:0;margin:0">' + list.map((x) => '<li><span>' + esc(cname(x.id)) + '</span><span class="num">' + x.n + '</span><span class="bar"><span style="width:' + (x.n / max * 100) + '%"></span></span></li>').join('') + '</ul>';
    })();

    return '<div class="page-head"><h1 class="page-title">Dashboard</h1>' +
      '<div class="dash-head"><div class="seg">' + periods.map((p) => '<button class="' + (per.p === p[0] ? 'on' : '') + '" data-act="set-filter" data-key="period" data-value="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>' +
      '<span class="muted small">Updated ' + fmtDT(BN.S.dashUpdated).slice(11) + '</span><button class="btn btn-secondary btn-sm" data-act="refresh">Refresh</button></div></div>' +
      '<div class="kpis">' + tiles + '</div>' +
      '<div class="grid-2"><section class="card"><h2 class="section">Upcoming trips</h2>' +
      (upcoming.length ? '<div class="tbl-wrap"><table><thead><tr><th>Trip ID</th><th>Start</th><th>Route</th><th>PAX</th><th>Company</th><th>Status</th></tr></thead><tbody>' +
        upcoming.map((v) => '<tr class="row" tabindex="0" data-act="open" data-href="#/trips/' + v.t.id + '"><td class="id">' + v.t.id + '</td><td class="nowrap">' + fmtDT(v.t.plannedStart) + '</td><td>' + routeCell(v.t) + '</td><td class="num">' + (v.t.pax || '—') + '</td><td>' + companyCell(v) + '</td><td>' + pill(v.status) + '</td></tr>').join('') +
        '</tbody></table></div>' : '<p class="muted">No upcoming trips.</p>') + '</section>' +
      '<section class="card">' + actionHtml + '</section></div>' +
      '<div class="grid-2" style="margin-top:16px"><section class="card"><h2 class="section">Trip volume · last 12 weeks</h2>' + volumeChart(vms) + '</section>' +
      '<section class="card"><h2 class="section">Top partners</h2>' + topPartners + '</section></div>';
  };

  /* ---------- S-06 trip detail ---------- */
  function threadHtml(t, v) {
    const cid = myCid(), host = v.side === 'SHARED';
    const pid = host ? (BN.S.threadSel[t.id] || t.acceptedPartnerId || (t.requests[0] || {}).partnerId) : cid;
    const items = t.thread.filter((c) => c.partnerId === pid);
    const sel = host && t.requests.length > 1
      ? '<label class="thread-sel">Thread with <select data-change="thread" data-id="' + t.id + '">' + t.requests.map((x) => '<option value="' + x.partnerId + '"' + (x.partnerId === pid ? ' selected' : '') + '>' + esc(cname(x.partnerId)) + ' (' + t.thread.filter((c) => c.partnerId === x.partnerId).length + ')</option>').join('') + '</select></label>' : '';
    const list = items.length ? items.map((c) => '<li class="comment' + (c.companyId === cid ? ' own' : '') + (c.companyId !== cid && c.readBy.indexOf(BN.S.userId) === -1 ? ' unread' : '') + '">' +
      '<div class="c-meta"><strong>' + esc(c.authorName) + '</strong><span>' + esc(cname(c.companyId)) + '</span><time>' + fmtDT(c.at) + '</time></div><p>' + esc(c.body) + '</p></li>').join('')
      : '<li class="muted">No comments yet.</li>';
    const composer = can('comment') ? '<div class="composer"><label class="sr-only" for="c-body">Write a comment</label>' +
      '<textarea id="c-body" rows="3" maxlength="2000" placeholder="Write a comment to ' + esc(cname(host ? pid : t.hostId)) + '"></textarea>' +
      '<button class="btn btn-primary btn-sm" data-act="post-comment" data-id="' + t.id + '" data-pid="' + pid + '">Post comment</button></div>' : '';
    return '<section class="card" id="comments"><h2 class="section">Comments</h2>' + sel + '<ul class="thread" role="list">' + list + '</ul>' + composer + '</section>';
  }
  function historyHtml(t, v) {
    const cid = myCid(), host = v.side === 'SHARED';
    const f = BN.S.histFilter[t.id] || 'all';
    const items = t.history
      .filter((h) => host || h.visibleTo === 'BOTH' || h.visibleTo === cid)
      .filter((h) => f === 'all' || h.kind === f);
    const chipsHtml = [['all', 'All'], ['status', 'Status'], ['price', 'Price'], ['edit', 'Edits']]
      .map((x) => '<button class="chip quick' + (f === x[0] ? ' on' : '') + '" data-act="hist-filter" data-id="' + t.id + '" data-value="' + x[0] + '">' + x[1] + '</button>').join('');
    return '<section class="card"><h2 class="section">History</h2><div class="filters-inline">' + chipsHtml + '</div>' +
      (items.length ? '<ul class="timeline">' + items.map((h) => '<li><time>' + fmtDT(h.at) + '</time><div><span class="who">' + esc(h.actor) + (h.companyId ? ' · ' + esc(cname(h.companyId)) : '') + '</span><br><span class="what">' + esc(h.action) + (h.detail ? ': ' + esc(h.detail) : '') + '</span></div></li>').join('') + '</ul>' : '<p class="muted">Nothing recorded yet.</p>') + '</section>';
  }
  BN.pageTrip = function (id) {
    const t = BN.tripById(id), cid = myCid();
    if (!t || !BN.sideOf(t, cid)) {

  <script>

  };

  BN.formOffer = function (pid) {
    const d = BN.S.form.data;

              if (!st.start || !st.end || Date.parse(BN.localToIso(st.end)) <= Date.parse(BN.localToIso(st.start))) e['shifts.' + si + '.subTrips.' + ti + '.start'] = 'Sub-trip end must be after its start.';

        else if (!(o.offer > 0)) e['offer.' + pid] = 'Enter an offer price for ' + cname(pid) + ' — there is no price agreement.';

        });

      }

  };

  BN.addAttachments = function (files) {
